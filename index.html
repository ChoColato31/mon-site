<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Ultimate Tennis</title><style>
*{box-sizing:border-box}body{margin:0;background:#06101b;color:#f4f8fc;font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:#168cff;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#173049}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:27px;font-weight:950}.brand span{color:#35c5ff}.wallet{background:#10263b;border:1px solid #28445d;border-radius:999px;padding:8px 12px}.nav{display:flex;gap:7px;overflow:auto;padding:14px 0}.nav button{background:#10243a;white-space:nowrap}.nav .on{background:#168cff}.card{background:linear-gradient(180deg,#10243a,#0b1b2c);border:1px solid #23435d;border-radius:16px;padding:17px;margin:11px 0;box-shadow:0 10px 28px #0002}.grid{display:grid;gap:11px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#081a2b;border:1px solid #1d3952;border-radius:12px;padding:13px}.stat small,.muted{color:#8ea7bc}.stat strong{display:block;font-size:23px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #1d374e}.row:last-child{border:0}.row small{display:block;color:#8ea7bc;margin-top:3px}.hero{text-align:center;padding:80px 12px}.hero h1{font-size:55px;margin:0;letter-spacing:-2px}.hero h1 span{color:#35c5ff}.hero p{color:#8ea7bc;max-width:700px;margin:12px auto 25px;font-size:16px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{padding:12px;background:#071523;color:#fff;border:1px solid #28445d;border-radius:10px;width:100%}.bar{height:8px;background:#1b344a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#168cff,#35c5ff)}.actions{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;padding:5px 8px;background:#17314a;border-radius:7px;color:#b9d7ec;font-size:12px}.notice{padding:11px 13px;background:#102b43;border-left:3px solid #35c5ff;border-radius:8px}.danger{color:#ff6675}.good{color:#28d391}.gold{color:#ffd166}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{background:#132b43}.tabs button.on{background:#168cff}.table{overflow:auto}.rank{display:grid;grid-template-columns:50px 1fr 100px 100px;gap:8px;padding:10px;border-bottom:1px solid #1d374e}.court{height:300px;max-width:760px;margin:16px auto;position:relative;background:#2780ad;border:5px solid white;overflow:hidden}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:white}.court:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:white}.net{position:absolute;left:50%;top:0;bottom:0;width:7px;background:#ddd}.me,.opp{position:absolute;width:34px;height:34px;border-radius:50%;z-index:3}.me{bottom:22px;left:calc(50% - 17px);background:#ff4e61}.opp{top:22px;left:calc(50% - 17px);background:#111827;border:2px solid white}.ball{position:absolute;width:15px;height:15px;border-radius:50%;background:#efff00;left:48%;top:48%;z-index:4}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bracket{display:flex;gap:10px;overflow:auto}.round{min-width:180px;background:#081a2b;border:1px solid #1e3b54;border-radius:10px;padding:10px}.round b{display:block;margin-bottom:7px}.feed{max-height:330px;overflow:auto}.feed p{padding:9px 0;border-bottom:1px solid #1c354c;margin:0}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{max-width:600px;width:100%;background:#10243a;border:1px solid #31516b;border-radius:16px;padding:20px}.hide{display:none!important}@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.shots{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:39px}.rank{grid-template-columns:38px 1fr 75px}.rank span:nth-child(4){display:none}}
</style></head><body><main id="app" class="app"></main><div id="modal" class="modal hide"></div><script>
'use strict';
const KEY='ultimateTennisCareerFinal';
const events=[
['Australian Open','🇦🇺','Grand Chelem',2000,'Dur'],['Indian Wells','🇺🇸','Masters 1000',1000,'Dur'],['Miami Open','🇺🇸','Masters 1000',1000,'Dur'],['Monte-Carlo','🇲🇨','Masters 1000',1000,'Terre battue'],['Madrid','🇪🇸','Masters 1000',1000,'Terre battue'],['Rome','🇮🇹','Masters 1000',1000,'Terre battue'],['Roland-Garros','🇫🇷','Grand Chelem',2000,'Terre battue'],['Queen’s Club','🇬🇧','ATP 500',500,'Gazon'],['Wimbledon','🇬🇧','Grand Chelem',2000,'Gazon'],['Cincinnati','🇺🇸','Masters 1000',1000,'Dur'],['US Open','🇺🇸','Grand Chelem',2000,'Dur'],['Shanghai','🇨🇳','Masters 1000',1000,'Dur'],['Paris','🇫🇷','Masters 1000',1000,'Dur'],['ATP Finals','🇮🇹','Finals',1500,'Dur']];
const names=['Jannik Sinner','Carlos Alcaraz','Alexander Zverev','Daniil Medvedev','Novak Djokovic','Taylor Fritz','Alex de Minaur','Lorenzo Musetti','Ben Shelton','Holger Rune','Casper Ruud','Andrey Rublev','Stefanos Tsitsipas','Francisco Cerundolo','Sebastian Korda','Arthur Fils','Jack Draper','Tommy Paul','Ugo Humbert','Matteo Berrettini'];
const styles=['Gros serveur','Agressif fond de court','Défenseur','Polyvalent','Contreur'];
let P=null,view='home',match=null;
function defaults(){return {first:'Arthur',last:'Dupont',country:'🇫🇷 France',style:'Agressif fond de court',age:17,year:2026,week:1,money:8000,points:25,rank:950,fitness:90,morale:78,energy:90,serve:58,return:55,forehand:62,backhand:58,speed:65,stamina:68,mental:55,coach:0,physio:0,fitnessCoach:0,coachName:'Aucun',wins:0,losses:0,titles:0,slams:0,careerPrize:0,seasonPrize:0,history:[],results:[]}}
function load(){try{P=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){P=null}}function save(){localStorage.setItem(KEY,JSON.stringify(P))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function ovr(){return Math.round((P.serve+P.return+P.forehand+P.backhand+P.speed+P.stamina+P.mental)/7)}function calcRank(){return Math.max(1,Math.round(1050-P.points/16))}
function shell(body){document.getElementById('app').innerHTML='<div class="top"><div class="brand">🎾 <span>ULTIMATE</span> TENNIS</div>'+(P?'<div class="wallet">💰 '+P.money.toLocaleString('fr-FR')+' €</div>':'')+'</div>'+(P?nav():'')+body}
function nav(){const a=[['dash','🏠 Accueil'],['tourneys','🏆 Tournois'],['calendar','📅 Calendrier'],['ranking','🌍 Classement'],['training','💪 Entraînement'],['player','👤 Joueur'],['staff','👔 Staff'],['finance','💰 Finances'],['history','📚 Carrière']];return '<div class="nav">'+a.map(x=>'<button class="'+(view===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>'}
function go(v){view=v;render()}
function render(){if(!P){home();return}if(view==='dash')dash();else if(view==='tourneys')tourneys();else if(view==='calendar')calendar();else if(view==='ranking')ranking();else if(view==='training')training();else if(view==='player')player();else if(view==='staff')staff();else if(view==='finance')finance();else if(view==='history')history();else if(view==='match')matchPage();else dash()}
function home(){shell('<section class="hero"><h1>ULTIMATE <span>TENNIS</span></h1><p>Une simulation de carrière tennis complète : circuit mondial, tournois, progression, fatigue, staff, finances, matchs et classement.</p><button onclick="create()">Créer ma carrière</button> <button class="secondary" onclick="demo()">Lancer une démo</button></section>')}
function create(){shell('<div class="card"><h2>Créer ton joueur</h2><div class="grid g2"><div class="field"><label>Prénom</label><input id="first" placeholder="Arthur"></div><div class="field"><label>Nom</label><input id="last" placeholder="Dupont"></div></div><div class="grid g2"><div class="field"><label>Pays</label><select id="country"><option>🇫🇷 France</option><option>🇪🇸 Espagne</option><option>🇮🇹 Italie</option><option>🇺🇸 États-Unis</option><option>🇷🇸 Serbie</option><option>🇬🇧 Royaume-Uni</option></select></div><div class="field"><label>Style de jeu</label><select id="style">'+styles.map(s=>'<option>'+s+'</option>').join('')+'</select></div></div><div class="notice">Tu débutes à 17 ans avec un classement modeste. Le potentiel n’est pas magique : les progrès dépendent du travail, de l’âge, du staff, des résultats et de la fatigue.</div><br><button onclick="start()">Lancer la carrière</button></div>')}
function newPlayer(first,last,country,style){let x=defaults();x.first=first;x.last=last;x.country=country;x.style=style;return x}
function start(){P=newPlayer(document.getElementById('first').value||'Arthur',document.getElementById('last').value||'Dupont',document.getElementById('country').value,document.getElementById('style').value);save();view='dash';render()}
function demo(){P=newPlayer('Arthur','Magic','🇫🇷 France','Agressif fond de court');save();view='dash';render()}
function dash(){const e=events[P.week-1]||events[0];shell('<div class="card"><div class="top"><div><h2>'+esc(P.first)+' '+esc(P.last)+'</h2><span class="muted">'+P.country+' • '+P.age+' ans • '+P.style+'</span></div><span class="tag">ATP #'+calcRank()+' • OVR '+ovr()+'</span></div></div><div class="grid g4"><div class="stat"><small>Classement</small><strong>#'+calcRank()+'</strong></div><div class="stat"><small>Points</small><strong>'+P.points+'</strong></div><div class="stat"><small>Bilan</small><strong>'+P.wins+'–'+P.losses+'</strong></div><div class="stat"><small>Titres</small><strong>'+P.titles+'</strong></div></div><div class="card"><h3>Prochain tournoi</h3><div class="row"><span>'+e[1]+' <b>'+e[0]+'</b><small>'+e[2]+' • '+e[4]+'</small></span><b>'+e[3]+' pts</b></div><div class="actions"><button onclick="enterTournament()">🎾 Participer</button><button class="secondary" onclick="recover()">😴 Récupérer</button></div></div><div class="grid g3"><div class="stat"><small>Forme</small><strong>'+P.fitness+'%</strong><div class="bar"><i style="width:'+P.fitness+'%"></i></div></div><div class="stat"><small>Énergie</small><strong>'+P.energy+'%</strong><div class="bar"><i style="width:'+P.energy+'%"></i></div></div><div class="stat"><small>Moral</small><strong>'+P.morale+'%</strong><div class="bar"><i style="width:'+P.morale+'%"></i></div></div></div><div class="card"><h3>📰 Actualités</h3><div class="feed">'+(P.history.length?P.history.slice(-6).reverse().map(x=>'<p>'+x+'</p>').join(''):'<p class="muted">Ta carrière commence. Le circuit t’attend.</p>')+'</div></div>')}
function tourneys(){shell('<div class="card"><h2>🏆 Tournois disponibles</h2><p class="muted">Les tournois majeurs donnent plus de points mais exigent un niveau et une forme supérieurs.</p>'+events.map((e,i)=>'<div class="row"><span><b>'+e[1]+' '+e[0]+'</b><small>'+e[2]+' • '+e[4]+' • semaine '+(i+1)+'</small></span><span><b>'+e[3]+' pts</b><br><button onclick="choose('+i+')">Voir</button></span></div>').join('')+'</div>')}
function choose(i){const e=events[i];show('<h2>'+e[1]+' '+e[0]+'</h2><p>'+e[2]+' • '+e[4]+' • '+e[3]+' points</p><p>Format : tableau à élimination directe. Les tours successifs rapportent des points et du prize money.</p><button onclick="closeModal();enterAt('+i+')">Préparer ce tournoi</button> <button class="secondary" onclick="closeModal()">Fermer</button>')}
function calendar(){shell('<div class="card"><h2>📅 Saison '+P.year+'</h2>'+events.map((e,i)=>'<div class="row"><span><b>'+i+'. '+e[1]+' '+e[0]+'</b><small>'+e[2]+' • '+e[4]+'</small></span><b>'+e[3]+' pts</b></div>').join('')+'</div>')}
function ranking(){let top=[['Jannik Sinner',11800],['Carlos Alcaraz',10400],['Novak Djokovic',8200],['Alexander Zverev',7000],['Daniil Medvedev',6100],['Taylor Fritz',5200],['Alex de Minaur',4300],['Lorenzo Musetti',3900],['Ben Shelton',3500],['Holger Rune',3300],['Casper Ruud',3200],['Andrey Rublev',3100],['Stefanos Tsitsipas',2950],['Arthur Fils',2600],['Jack Draper',2500]];top.push([P.first+' '+P.last,P.points]);top.sort((a,b)=>b[1]-a[1]);shell('<div class="card"><h2>🌍 Classement ATP</h2>'+top.map((x,i)=>'<div class="rank"><span>#'+(i+1)+'</span><span>'+esc(x[0])+'</span><span>'+x[1]+' pts</span><span>'+(i===top.length-1&&x[0]===P.first+' '+P.last?'Toi':'')+'</span></div>').join('')+'</div>')}
function training(){const a=[['serve','Service'],['return','Retour'],['forehand','Coup droit'],['backhand','Revers'],['speed','Déplacement'],['stamina','Endurance'],['mental','Mental']];shell('<div class="card"><h2>💪 Centre d’entraînement</h2><p>Une séance dure une partie de ta journée et réduit l’énergie. Le staff améliore l’efficacité.</p><div class="grid g3">'+a.map(x=>'<button onclick="train(\''+x[0]+'\')">'+x[1]+' +1</button>').join('')+'</div></div><div class="card"><h3>État physique</h3><p>Forme '+P.fitness+'%</p><div class="bar"><i style="width:'+P.fitness+'%"></i></div><p>Énergie '+P.energy+'%</p><div class="bar"><i style="width:'+P.energy+'%"></i></div></div>')}
function train(s){if(P.energy<15){alert('Tu es trop fatigué. Récupère.');return}let cap=P.age<21?85:P.age<27?91:P.age<31?94:90;P[s]=Math.min(cap,P[s]+1);P.energy=Math.max(0,P.energy-12);P.fitness=Math.max(0,P.fitness-4);P.morale=Math.min(100,P.morale+1);save();render()}
function recover(){P.energy=Math.min(100,P.energy+32+P.fitnessCoach*4);P.fitness=Math.min(100,P.fitness+20+P.physio*3);P.morale=Math.min(100,P.morale+3);P.week++;advanceSeason();save();render()}
function advanceSeason(){if(P.week>14){P.week=1;P.year++;P.age++;P.seasonPrize=0;P.points=Math.max(1,Math.round(P.points*.72));P.history.push('📅 Nouvelle saison : '+P.year+'. Tu as maintenant '+P.age+' ans.');}}
function player(){let stats=[['serve','Service'],['return','Retour'],['forehand','Coup droit'],['backhand','Revers'],['speed','Déplacement'],['stamina','Endurance'],['mental','Mental']];shell('<div class="card"><h2>👤 Profil</h2><p>'+P.country+' • '+P.age+' ans • '+P.style+' • potentiel évolutif</p><div class="grid g3">'+stats.map(s=>'<div class="stat"><small>'+s[1]+'</small><strong>'+P[s[0]]+'</strong><div class="bar"><i style="width:'+P[s[0]]+'%"></i></div></div>').join('')+'</div></div><div class="card"><h3>Surfaces</h3><div class="grid g3"><div class="stat"><small>Dur</small><strong>'+P.hard+'/100</strong></div><div class="stat"><small>Terre battue</small><strong>'+P.clay+'/100</strong></div><div class="stat"><small>Gazon</small><strong>'+P.grass+'/100</strong></div></div></div>')}
function staff(){shell('<div class="card"><h2>👔 Staff</h2>'+[['coach','Coach principal',1500,'coachName'],['physio','Kinésithérapeute',1800,'physio'],['fitnessCoach','Préparateur physique',1700,'fitnessCoach']].map(x=>'<div class="row"><span><b>'+x[1]+'</b><small>Niveau '+P[x[0]]+'</small></span><button onclick="hire(\''+x[0]+'\','+x[2]+')">Améliorer '+x[2]+' €</button></div>').join('')+'</div><div class="notice">Le staff augmente progressivement la récupération et l’efficacité de l’entraînement.</div>')}
function hire(k,c){if(P.money<c){alert('Budget insuffisant');return}P.money-=c;P[k]++;save();render()}
function finance(){shell('<div class="card"><h2>💰 Finances</h2><div class="grid g3"><div class="stat"><small>Solde</small><strong>'+P.money.toLocaleString('fr-FR')+' €</strong></div><div class="stat"><small>Prize money carrière</small><strong>'+P.careerPrize.toLocaleString('fr-FR')+' €</strong></div><div class="stat"><small>Prize money saison</small><strong>'+P.seasonPrize.toLocaleString('fr-FR')+' €</strong></div></div><p class="muted">Les dépenses de staff sont payées immédiatement. Dans une version ultérieure, les déplacements, hôtels et sponsors pourront être détaillés.</p></div>')}
function history(){shell('<div class="card"><h2>📚 Historique</h2><p>Âge : '+P.age+' • Saisons : '+(P.year-2026+1)+' • Titres : '+P.titles+' • Grand Chelems : '+P.slams+'</p><div class="feed">'+(P.results.length?P.results.slice().reverse().map(x=>'<p>'+x+'</p>').join(''):'<p class="muted">Aucun résultat.</p>')+'</div></div>')}
function enterAt(i){P.tournament=i;save();enterTournament()}
function enterTournament(){let e=events[P.tournament];if(!e)return;if(P.fitness<40||P.energy<35){alert('Ta condition physique est insuffisante pour jouer ce tournoi.');return}let min=e[2]==='Grand Chelem'?72:e[2]==='Masters 1000'?68:e[2]==='ATP 500'?64:55;if(ovr()+P.fitness/12<min){alert('Ton niveau est trop faible pour ce tableau principal. Dans une future version, tu passeras par les qualifications.');return}startMatch()}
function surfaceBonus(surface){if(surface==='Dur')return P.hard/100;if(surface==='Terre battue')return P.clay/100;return P.grass/100}
function startMatch(){let e=events[P.tournament],op=names[Math.floor(Math.random()*names.length)];let opRating=Math.max(58,Math.min(94,ovr()+Math.floor(Math.random()*21)-10));match={event:e,op:op,opRating:opRating,round:1,sw:0,sl:0,gp:0,go:0,tbp:false};view='match';render()}
function matchPage(){shell('<div class="card"><div style="text-align:center"><span class="tag">'+match.event[2]+' • '+match.event[4]+'</span><h2>'+match.event[1]+' '+match.event[0]+'</h2><p class="muted">Tour '+match.round+' • '+esc(match.op)+' • niveau '+match.opRating+'</p><div style="font-size:44px;font-weight:950">'+match.sw+' — '+match.sl+'</div><div class="muted">Jeu '+match.gp+' — '+match.go+'</div></div><div class="court"><div class="opp"></div><div class="net"></div><div class="ball"></div><div class="me"></div></div><div class="shots"><button onclick="shot(\'serve\')">🚀 Service</button><button onclick="shot(\'safe\')">🎾 Échange sûr</button><button onclick="shot(\'attack\')">🔥 Attaque</button><button onclick="shot(\'power\')">💥 Risqué</button></div><p class="notice">Le match tient compte de tes qualités, de la surface, de la forme, de l’énergie et du niveau de l’adversaire.</p></div>')}
function shot(type){let s=surfaceBonus(match.event[4]);let attack=type==='attack'?4:type==='power'?8:0;let serve=type==='serve'?P.serve*.11:0;let base=ovr()*.52+P.fitness*.18+P.morale*.05+s*8+serve+attack;let opp=match.opRating*.68+Math.random()*14;let win=base+Math.random()*35>opp;P.energy=Math.max(0,P.energy-1.5);P.fitness=Math.max(0,P.fitness-.25);if(win)match.gp++;else match.go++;if((match.gp>=4||match.go>=4)&&Math.abs(match.gp-match.go)>=2){if(match.gp>match.go)match.sw++;else match.sl++;match.gp=0;match.go=0}if(match.sw>=2||match.sl>=2){finishMatch();return}if(match.gp===6&&match.go===6){if(Math.random()>.5)match.sw++;else match.sl++;match.gp=0;match.go=0}render()}
function finishMatch(){let win=match.sw>match.sl,e=match.event,round=match.round;let maxRounds=e[2]==='Grand Chelem'?7:e[2]==='Finals'?3:5;let reached=win?round:Math.max(1,round-1);let mult={1:.05,2:.12,3:.25,4:.5,5:.7,6:.85,7:1}[reached]||.05;let pts=Math.round(e[3]*mult);let prize=Math.round((e[3]*10+500)*mult);P.points+=win?pts:Math.round(pts*.5);P.money+=prize;P.careerPrize+=prize;P.seasonPrize+=prize;if(win)P.wins++;else P.losses++;if(win&&round===maxRounds){P.titles++;if(e[2]==='Grand Chelem')P.slams++}P.fitness=Math.max(0,P.fitness-8);P.energy=Math.max(0,P.energy-15);P.morale=Math.max(20,Math.min(100,P.morale+(win?5:-4)));let result=(win?'Victoire':'Défaite')+' — '+e[0]+' — '+esc(match.op)+' — tour '+round+' — +'+pts+' pts / +'+prize+' €';P.results.push(result);P.history.push((win?'🎾 ':'❌ ')+result);if(win&&round<maxRounds){match.round++;match.sw=0;match.sl=0;match.gp=0;match.go=0;match.op=names[Math.floor(Math.random()*names.length)];match.opRating=Math.max(58,Math.min(96,ovr()+Math.floor(Math.random()*25)-12));render();return}P.tournament++;if(P.tournament>=events.length)P.tournament=0;P.week=Math.min(14,P.tournament+1);advanceSeason();save();view='dash';render()}
function show(html){document.getElementById('modal').innerHTML='<div class="modalbox">'+html+'</div>';document.getElementById('modal').classList.remove('hide')}function closeModal(){document.getElementById('modal').classList.add('hide')}
window.go=go;window.create=create;window.start=start;window.demo=demo;window.train=train;window.recover=recover;window.enterTournament=enterTournament;window.enterAt=enterAt;window.choose=choose;window.hire=hire;window.shot=shot;window.closeModal=closeModal;load();render();
</script></main></body></html>
