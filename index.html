<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultimate Tennis</title><style>
:root{--bg:#07111f;--panel:#102238;--panel2:#162d46;--blue:#168cff;--green:#20c982;--gold:#ffd34d;--muted:#8ea9c3;--danger:#ff5d6c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 20% 0,#16466b 0,transparent 32%),var(--bg);color:#fff}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;background:var(--blue);color:white;font-weight:800;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:18px}.hidden{display:none!important}.card{background:rgba(16,34,56,.94);border:1px solid #21405e;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.muted{color:var(--muted)}.gold{color:var(--gold)}.green{color:var(--green)}.danger{color:var(--danger)}h1,h2,h3,p{margin-top:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:34px;font-weight:1000}.pill{background:#19334d;padding:8px 11px;border-radius:999px}.stat{padding:14px;background:#0c1d30;border-radius:14px}.stat b{font-size:25px;display:block}.bar{height:9px;background:#233c55;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0}.nav button{background:#122940;white-space:nowrap}.nav button.active{background:var(--blue)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-bottom:1px solid #203950}.row:last-child{border:0}.hero{text-align:center;padding:50px 10px}.hero h1{font-size:48px;margin:0}.hero button{margin:6px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{background:#081525;color:white;border:1px solid #29435f;border-radius:10px;padding:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.matchscore{font-size:44px;text-align:center;font-weight:1000}.court{height:250px;position:relative;background:#2377a8;border:5px solid white;border-radius:5px;overflow:hidden;margin:15px 0}.court:before{content:"";position:absolute;left:50%;top:0;height:100%;width:3px;background:white}.net{position:absolute;left:50%;top:0;height:100%;width:6px;background:#ddd}.dot{position:absolute;width:34px;height:34px;border-radius:50%;background:#ff4655;bottom:25px;left:calc(50% - 17px)}.enemy{position:absolute;width:34px;height:34px;border-radius:50%;background:#222;top:25px;left:calc(50% - 17px)}.ball{position:absolute;width:16px;height:16px;border-radius:50%;background:#eaff00;left:48%;top:48%;transition:.2s}.toast{position:fixed;right:15px;bottom:15px;background:#132b43;border:1px solid #2a4b68;padding:14px;border-radius:12px;max-width:330px}.small{font-size:13px}@media(max-width:700px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:38px}.wrap{padding:12px}}
</style></head><body><div id="app" class="wrap"></div><div id="toast" class="toast hidden"></div><script>
const KEY='ultimateTennisCareerV2';let P=JSON.parse(localStorage.getItem(KEY)||'null');let page='home';let match=null;
const tournaments=[['ATP Challenger Marseille','🇫🇷','Challenger',125],['Indian Wells','🇺🇸','Masters 1000',1000],['Miami Open','🇺🇸','Masters 1000',1000],['Monte-Carlo','🇲🇨','Masters 1000',1000],['Madrid Open','🇪🇸','Masters 1000',1000],['Rome Masters','🇮🇹','Masters 1000',1000],['Roland-Garros','🇫🇷','Grand Chelem',2000],['Queen’s Club','🇬🇧','ATP 500',500],['Wimbledon','🇬🇧','Grand Chelem',2000],['Cincinnati','🇺🇸','Masters 1000',1000],['US Open','🇺🇸','Grand Chelem',2000],['Paris Masters','🇫🇷','Masters 1000',1000],['ATP Finals','🇮🇹','Finals',1500]];
const names=['Alex Novak','Lucas Moretti','Noah Williams','Mateo Silva','Hugo Martin','Ethan Cole','Liam Parker','Leo Rossi','Milan Kovac','Arthur Dupont','Diego Alvarez','Tom Becker','Adam Wilson','Nico Romano','Jonas Berg'];
function save(){localStorage.setItem(KEY,JSON.stringify(P))}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function avg(){return Math.round((P.serve+P.forehand+P.backhand+P.speed+P.stamina+P.mental)/6)}
function rank(){return Math.max(1,Math.round(850-P.points/18))}
function nav(){return `<div class="nav">${[['dash','🏠 Carrière'],['calendar','📅 Calendrier'],['training','💪 Entraînement'],['ranking','🏆 Classement'],['player','👤 Joueur'],['shop','🛒 Équipement']].map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function shell(body){document.getElementById('app').innerHTML=`<div class="top"><div class="logo">🎾 ULTIMATE TENNIS</div>${P?`<div class="pill">💰 ${P.money} € &nbsp; #${rank()}</div>`:''}</div>${P?nav():''}${body}`}
function go(x){page=x;render()}
function render(){if(!P){shell(`<div class="hero"><h1>ULTIMATE TENNIS</h1><p class="muted">Carrière tennis • classement • tournois • entraînement • équipement</p><button onclick="create()">Créer ma carrière</button><button onclick="demo()">Démo</button></div>`);return}if(page==='dash')dash();else if(page==='calendar')calendar();else if(page==='training')training();else if(page==='ranking')ranking();else if(page==='player')playerPage();else if(page==='shop')shop();else if(page==='match')matchPage()}
function create(){shell(`<div class="card"><h2>Créer ton joueur</h2><div class="field"><label>Prénom</label><input id="fn" placeholder="Arthur"></div><div class="field"><label>Nom</label><input id="ln" placeholder="Dupont"></div><div class="field"><label>Pays</label><select id="ct"><option>🇫🇷 France</option><option>🇪🇸 Espagne</option><option>🇮🇹 Italie</option><option>🇺🇸 États-Unis</option><option>🇷🇸 Serbie</option><option>🇬🇧 Royaume-Uni</option></select></div><div class="field"><label>Style</label><select id="st"><option>Offensif</option><option>Défenseur</option><option>Polyvalent</option><option>Serveur-volleyeur</option></select></div><button onclick="startCareer()">Lancer la carrière</button></div>`)}
function startCareer(){let fn=document.getElementById('fn').value.trim()||'Arthur',ln=document.getElementById('ln').value.trim()||'Dupont';P={first:fn,last:ln,country:document.getElementById('ct').value,style:document.getElementById('st').value,money:5000,points:25,age:17,year:2026,week:1,serve:60,forehand:62,backhand:58,speed:65,stamina:70,mental:55,fitness:92,morale:80,wins:0,losses:0,titles:0,slams:0,seasonMoney:0,history:[]};save();page='dash';render();toast('Carrière créée !')}
function demo(){P={first:'Arthur',last:'Magic',country:'🇫🇷 France',style:'Offensif',money:5000,points:25,age:17,year:2026,week:1,serve:60,forehand:62,backhand:58,speed:65,stamina:70,mental:55,fitness:92,morale:80,wins:0,losses:0,titles:0,slams:0,seasonMoney:0,history:[]};save();page='dash';render()}
function dash(){let next=tournaments[Math.min(P.week-1,tournaments.length-1)];shell(`<div class="card"><div class="top"><div><h2>${esc(P.first)} ${esc(P.last)}</h2><span class="muted">${P.country} • ${P.style} • ${P.age} ans</span></div><div class="pill">Saison ${P.year} • semaine ${P.week}</div></div></div><div class="grid g4"><div class="stat"><span class="muted">Classement</span><b>#${rank()}</b></div><div class="stat"><span class="muted">Points</span><b>${P.points}</b></div><div class="stat"><span class="muted">Bilan</span><b>${P.wins}-${P.losses}</b></div><div class="stat"><span class="muted">Titres</span><b>${P.titles}</b></div></div><div class="card"><h3>Prochain rendez-vous</h3><div class="row"><span>${next?next[1]+' '+next[0]:'Hors calendrier'}</span><strong>${next?next[2]:''}</strong></div><div class="actions"><button onclick="playTournament()">🎾 Jouer le tournoi</button><button onclick="rest()">😴 Repos</button><button onclick="go('training')">💪 Préparer</button></div></div><div class="card"><h3>Forme</h3><p>Physique ${P.fitness}%</p><div class="bar"><i style="width:${P.fitness}%"></i></div><p>Morale ${P.morale}%</p><div class="bar"><i style="width:${P.morale}%"></i></div></div><div class="card"><h3>Palmarès</h3><p>${P.titles} titre(s) • ${P.slams} Grand Chelem • ${P.seasonMoney} € gagnés cette saison</p></div>`)}
function calendar(){shell(`<div class="card"><h2>📅 Calendrier ATP</h2>${tournaments.map((t,i)=>`<div class="row"><span>${i+1}. ${t[1]} ${t[0]}<small class="muted"> ${t[2]}</small></span><strong>${t[3]} pts</strong></div>`).join('')}</div>`)}
function training(){shell(`<div class="card"><h2>💪 Centre d'entraînement</h2><p class="muted">Chaque séance coûte une partie de ta forme et améliore une compétence.</p><div class="grid g2">${[['serve','🚀 Service'],['forehand','🎾 Coup droit'],['backhand','🔄 Revers'],['speed','⚡ Vitesse'],['stamina','🫁 Endurance'],['mental','🧠 Mental']].map(a=>`<button onclick="train('${a[0]}')">${a[1]} +2</button>`).join('')}</div><div class="card"><p>Forme : ${P.fitness}%</p><div class="bar"><i style="width:${P.fitness}%"></i></div></div></div>`)}
function train(stat){if(!stat)return go('training');if(P.fitness<8)return toast('Pas assez de forme. Repose-toi.');P[stat]=Math.min(99,P[stat]+2);P.fitness=Math.max(0,P.fitness-8);P.morale=Math.min(100,P.morale+1);save();toast(`${stat} amélioré !`);render()}
function rest(){P.fitness=Math.min(100,P.fitness+22);P.morale=Math.min(100,P.morale+4);P.week++;save();toast('Semaine de repos terminée');render()}
function ranking(){let base=[['Jannik Sinner',11200],['Carlos Alcaraz',10400],['Novak Djokovic',8200],['Alexander Zverev',6800],['Daniil Medvedev',6100],['Taylor Fritz',5200],['Holger Rune',4700],['Alex de Minaur',4300],['Lorenzo Musetti',3900],['Ben Shelton',3500]];let me={name:`${P.first} ${P.last}`,pts:P.points};let all=[...base,me].sort((a,b)=>(b[1]||b.pts)-(a[1]||a.pts));shell(`<div class="card"><h2>🏆 Classement mondial</h2>${all.map((x,i)=>`<div class="row"><span><b>#${i+1}</b> &nbsp; ${esc(x.name)}</span><strong>${x.pts||x[1]} pts</strong></div>`).join('')}</div>`)}
function playerPage(){let stats=['serve','forehand','backhand','speed','stamina','mental'];shell(`<div class="card"><h2>👤 ${esc(P.first)} ${esc(P.last)}</h2><p>${P.country} • ${P.style} • ${P.age} ans</p><div class="grid g3">${stats.map(s=>`<div class="stat"><span>${s}</span><b>${P[s]}</b><div class="bar"><i style="width:${P[s]}%"></i></div></div>`).join('')}</div></div><div class="card"><h3>Statistiques carrière</h3><div class="grid g3"><div class="stat"><span>Victoires</span><b>${P.wins}</b></div><div class="stat"><span>Défaites</span><b>${P.losses}</b></div><div class="stat"><span>Titres</span><b>${P.titles}</b></div></div></div>`)}
function shop(){let items=[['Raquette contrôle','forehand',500],['Raquette puissance','serve',700],['Chaussures vitesse','speed',450],['Préparation physique','stamina',400],['Coach mental','mental',650]];shell(`<div class="card"><h2>🛒 Équipement & staff</h2>${items.map(x=>`<div class="row"><span>${x[0]}<small class="muted"> +3 ${x[1]}</small></span><button onclick="buy('${x[1]}',${x[2]})">${x[2]} €</button></div>`).join('')}</div>`)}
function buy(s,c){if(P.money<c)return toast('Pas assez d’argent');P.money-=c;P[s]=Math.min(99,P[s]+3);save();toast('Achat effectué !');render()}
function playTournament(){if(P.fitness<20)return toast('Il faut au moins 20% de forme.');let t=tournaments[Math.min(P.week-1,tournaments.length-1)];let opp=names[Math.floor(Math.random()*names.length)];match={t,opp,round:1,pg:0,eg:0,ps:0,es:0,finished:false};page='match';render()}
function matchPage(){shell(`<div class="card"><div class="top"><h2>${match.t[1]} ${match.t[0]}</h2><span>${match.t[2]}</span></div><div class="matchscore">${match.pg} - ${match.eg}</div><p style="text-align:center">${esc(P.first)} ${esc(P.last)} vs ${match.opp} • Tour ${match.round}</p><div class="court"><div class="enemy"></div><div class="net"></div><div id="ball" class="ball"></div><div class="dot"></div></div><div class="grid g2"><button onclick="shot('safe')">🎾 Coup sûr</button><button onclick="shot('attack')">🔥 Attaque</button><button onclick="shot('power')">💥 Puissance</button><button onclick="shot('serve')">🚀 Service</button></div><p id="msg" class="card">Choisis ton coup.</p></div>`)}
function shot(type){let bonus={safe:P.backhand*.16+P.mental*.05,attack:P.forehand*.18+P.speed*.04,power:P.forehand*.10+P.serve*.14,serve:P.serve*.2+P.mental*.04}[type];let chance=.45+(bonus-10)/100+(P.fitness-50)/500+(P.morale-50)/1000;chance=Math.max(.18,Math.min(.82,chance));let win=Math.random()<chance;if(win){match.pg++;P.morale=Math.min(100,P.morale+1);document.getElementById('msg').textContent='Point gagné !';}else{match.eg++;P.fitness=Math.max(0,P.fitness-1);document.getElementById('msg').textContent='Point perdu.'}let b=document.getElementById('ball');if(b){b.style.left=(Math.random()*75+10)+'%';b.style.top=(Math.random()*75+10)+'%'}if(match.pg>=4&&match.pg-match.eg>=2){match.ps++;match.pg=match.eg=0;toast('Set gagné !')}else if(match.eg>=4&&match.eg-match.pg>=2){match.es++;match.pg=match.eg=0;toast('Set perdu.')}if(match.ps>=2||match.es>=2)finishMatch();else render();}
function finishMatch(){let win=match.ps>match.es;let prize=win?Math.round(match.t[3]*2.5):Math.round(match.t[3]*.15);P.money+=prize;P.seasonMoney+=prize;P.points+=win?Math.round(match.t[3]*.08):Math.round(match.t[3]*.01);if(win){P.wins++;P.titles+=Math.random()<.15?1:0;P.slams+=match.t[2]==='Grand Chelem'?1:0}else P.losses++;P.fitness=Math.max(0,P.fitness-10);P.week++;if(P.week>tournaments.length){P.week=1;P.year++;P.age++;P.seasonMoney=0}save();page='dash';render();toast(win?`Victoire ! +${prize} €`:`Défaite • +${prize} €`)}
render();
</script></body></html>
