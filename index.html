<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0b0d"><title>Ultimate Tennis</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;touch-action:manipulation}body{background:radial-gradient(circle at 50% -10%,#40330f 0,#11100c 32%,#090909 75%);color:#f5f1e7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:350;font-size:14px}button,input,select{font:inherit;touch-action:manipulation}button{border:1px solid #6e5720;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#e2bd55,#a97d1d);color:#15110a;font-weight:650;cursor:pointer;user-select:none;-webkit-user-select:none}button:active{transform:scale(.98)}button.secondary{background:#171512;color:#e5d6a7;border-color:#4e411f}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:27px;font-weight:500;letter-spacing:.8px}.brand b{color:#e6c35b;font-weight:600}.wallet,.tag{background:#15130f;border:1px solid #4b3c1d;border-radius:999px;padding:8px 12px;color:#e5d6a7}.nav{display:flex;gap:6px;overflow:auto;padding:14px 0}.nav button{background:#12110f;color:#cfc5aa;border-color:#302817;white-space:nowrap;font-weight:450}.nav .on{background:#b98c2c;color:#fff8df;border-color:#d7b34d}.card{background:linear-gradient(180deg,#171512,#11100e);border:1px solid #342b19;border-radius:16px;padding:18px;margin:11px 0;box-shadow:0 12px 35px #0007}.grid{display:grid;gap:11px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#0e0d0b;border:1px solid #2d2618;border-radius:12px;padding:14px}.stat small,.muted{color:#9d967f}.stat strong{display:block;font-size:23px;font-weight:450;margin-top:4px;color:#f1dfad}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #292318}.row:last-child{border:0}.row small{display:block;color:#9d967f;margin-top:4px}.hero{text-align:center;padding:85px 12px}.hero h1{font-size:55px;margin:0;letter-spacing:-2px;font-weight:350}.hero h1 span{color:#e2bd55;font-weight:450}.hero p{color:#9d967f;max-width:720px;margin:14px auto 26px;font-size:16px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{padding:12px;background:#0c0b09;color:#eee5d0;border:1px solid #3a301e;border-radius:9px;width:100%}.bar{height:7px;background:#292319;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9c711d,#f0d170)}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px 14px;background:#19150d;border-left:3px solid #d0a73f;border-radius:7px;color:#c8b98e}.gold{color:#e5c35d}.good{color:#70c99a}.danger{color:#e77d7d}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{background:#14120f;color:#bdb39a}.tabs button.on{background:#a87c24;color:white}.bracket{display:flex;gap:12px;overflow:auto;padding-bottom:5px}.round{min-width:205px;background:#0d0c0a;border:1px solid #2e2618;border-radius:12px;padding:11px}.round h4{margin:0 0 9px;color:#d9bb69;font-weight:500}.matchbox{padding:10px;border:1px solid #282116;border-radius:9px;margin:7px 0;background:#14120f}.matchbox.win{border-color:#6d5520}.court{height:290px;max-width:760px;margin:16px auto;position:relative;background:#226f66;border:4px solid #eee6cf;overflow:hidden}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#eee}.court:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:#eee}.playerdot{position:absolute;width:30px;height:30px;border-radius:50%;bottom:20px;left:calc(50% - 15px);background:#e4c04f}.oppdot{position:absolute;width:30px;height:30px;border-radius:50%;top:20px;left:calc(50% - 15px);background:#161616;border:2px solid #fff}.ball{position:absolute;width:13px;height:13px;border-radius:50%;background:#efff2e;left:48%;top:48%;transition:.15s}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#15130f;border:1px solid #58451e;border-radius:16px;padding:20px}.hide{display:none!important}.mini{font-size:12px;color:#948c78}.progress{height:5px;background:#292319;border-radius:99px}.progress i{display:block;height:100%;background:#d1a83e}.feed{max-height:300px;overflow:auto}.feed p{padding:8px 0;border-bottom:1px solid #282116;margin:0}@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.shots{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:40px}.app{padding:12px}.brand{font-size:22px}}
</style></head><body><main id="app" class="app"></main><div id="modal" class="modal hide"></div><script>
'use strict';
const KEY='ultimateTennisV4';
const tourneys=[
['Australian Open','🇦🇺','Grand Chelem',2000,'Dur',1,128,40],['ATP Adelaide','🇦🇺','ATP 250',250,'Dur',2,28,32],['Challenger Canberra','🇦🇺','Challenger 125',125,'Dur',3,32,24],['ITF Melbourne','🇦🇺','ITF M25',25,'Dur',4,32,12],['Challenger Burnie','🇦🇺','Challenger 75',75,'Dur',5,32,16],['Challenger Cherbourg','🇫🇷','Challenger 75',75,'Dur',6,32,16],['ATP Marseille','🇫🇷','ATP 250',250,'Dur',7,28,32],['ATP Rotterdam','🇳🇱','ATP 500',500,'Dur',8,32,48],['Indian Wells','🇺🇸','Masters 1000',1000,'Dur',9,128,64],['Miami Open','🇺🇸','Masters 1000',1000,'Dur',10,128,64],['Challenger Lille','🇫🇷','Challenger 100',100,'Dur',11,48,24],['ITF Saint-Brieuc','🇫🇷','ITF M25',25,'Dur',12,32,12],['Monte-Carlo','🇲🇨','Masters 1000',1000,'Terre battue',13,96,56],['Barcelona','🇪🇸','ATP 500',500,'Terre battue',14,32,48],['Madrid','🇪🇸','Masters 1000',1000,'Terre battue',15,96,56],['Rome','🇮🇹','Masters 1000',1000,'Terre battue',16,96,56],['Challenger Bordeaux','🇫🇷','Challenger 125',125,'Terre battue',17,32,24],['ITF La Nucia','🇪🇸','ITF M25',25,'Terre battue',18,32,12],['Roland-Garros','🇫🇷','Grand Chelem',2000,'Terre battue',19,128,40],['Challenger Nottingham','🇬🇧','Challenger 125',125,'Gazon',20,32,24],['ATP Stuttgart','🇩🇪','ATP 250',250,'Gazon',21,28,32],['Queen’s Club','🇬🇧','ATP 500',500,'Gazon',22,32,48],['Wimbledon','🇬🇧','Grand Chelem',2000,'Gazon',23,128,40],['Challenger Braunschweig','🇩🇪','Challenger 100',100,'Terre battue',24,48,24],['ATP Umag','🇭🇷','ATP 250',250,'Terre battue',25,28,32],['Challenger Poznan','🇵🇱','Challenger 75',75,'Terre battue',26,32,16],['Olympic-style Cup','🌍','International',500,'Dur',27,64,32],['Cincinnati','🇺🇸','Masters 1000',1000,'Dur',28,96,56],['Winston-Salem','🇺🇸','ATP 250',250,'Dur',29,48,32],['US Open','🇺🇸','Grand Chelem',2000,'Dur',30,128,40],['Challenger Cary','🇺🇸','Challenger 100',100,'Dur',31,48,24],['ITF Columbus','🇺🇸','ITF M25',25,'Dur',32,32,12],['Challenger Orleans','🇫🇷','Challenger 125',125,'Dur',33,32,24],['ATP Tokyo','🇯🇵','ATP 500',500,'Dur',34,32,48],['Shanghai','🇨🇳','Masters 1000',1000,'Dur',35,96,56],['Challenger Shenzhen','🇨🇳','Challenger 100',100,'Dur',36,48,24],['ITF Antalya','🇹🇷','ITF M25',25,'Terre battue',37,32,12],['Paris','🇫🇷','Masters 1000',1000,'Dur',38,96,56],['ATP Finals','🇮🇹','Finals',1500,'Dur',39,8,8]];
const elite=['Jannik Sinner','Carlos Alcaraz','Novak Djokovic','Alexander Zverev','Daniil Medvedev','Taylor Fritz','Alex de Minaur','Lorenzo Musetti','Ben Shelton','Holger Rune','Casper Ruud','Andrey Rublev','Stefanos Tsitsipas','Francisco Cerundolo','Sebastian Korda','Arthur Fils','Jack Draper','Tommy Paul','Ugo Humbert','Matteo Berrettini'];
const firsts=['Lucas','Noah','Ethan','Hugo','Liam','Leo','Milan','Diego','Tom','Adam','Nico','Jonas','Max','Theo','Sacha','Enzo','Oscar','Felix','Milo','Rayan'];
const lasts=['Martin','Moretti','Williams','Cole','Parker','Rossi','Kovac','Alvarez','Becker','Wilson','Romano','Berg','Dubois','Garcia','Muller','Costa','Bennett','Leroy','Novak','Silva'];
let P=null,view='home',match=null;
function base(){return {first:'Arthur',last:'Dupont',country:'🇫🇷 France',style:'Agressif fond de court',age:17,year:2026,week:1,money:5000,points:25,fitness:92,energy:90,morale:78,serve:58,return:54,forehand:62,backhand:58,speed:65,stamina:68,mental:55,coach:0,physio:0,fitnessCoach:0,wins:0,losses:0,titles:0,slams:0,careerPrize:0,seasonPrize:0,history:[],results:[],current:null,injury:0}}
function load(){try{P=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){P=null}}function save(){localStorage.setItem(KEY,JSON.stringify(P))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function overall(){return Math.round((P.serve+P.return+P.forehand+P.backhand+P.speed+P.stamina+P.mental)/7)}function rank(){return Math.max(1,Math.round(1100-P.points/14))}function current(){return tourneys[P.week-1]||tourneys[0]}
function shell(body){document.getElementById('app').innerHTML='<div class="top"><div class="brand">🎾 <b>ULTIMATE</b> TENNIS</div>'+(P?'<div class="wallet">💰 '+P.money.toLocaleString('fr-FR')+' €</div>':'')+'</div>'+(P?nav():'')+body}
function nav(){let a=[['dash','Accueil'],['tourneys','Tournois'],['calendar','Calendrier'],['ranking','Classement'],['training','Entraînement'],['player','Joueur'],['staff','Staff'],['finance','Finances'],['history','Carrière']];return '<div class="nav">'+a.map(x=>'<button class="'+(view===x[0]?'on':'')+'" onclick="UT.go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>'}
function render(){if(!P){home();return}if(view==='dash')dash();else if(view==='tourneys')tourneys();else if(view==='calendar')calendar();else if(view==='ranking')ranking();else if(view==='training')training();else if(view==='player')player();else if(view==='staff')staff();else if(view==='finance')finance();else if(view==='history')history();else if(view==='match')matchPage();else dash()}
function home(){shell('<section class="hero"><h1>ULTIMATE <span>TENNIS</span></h1><p>Une carrière complète du circuit ITF jusqu’aux Grand Chelems : qualifications, tableaux, progression, fatigue, staff, finances et matchs.</p><button onclick="UT.create()">Créer ma carrière</button> <button class="secondary" onclick="UT.demo()">Démo</button></section>')}
function create(){shell('<div class="card"><h2>Créer ton joueur</h2><div class="grid g2"><div class="field"><label>Prénom</label><input id="first" placeholder="Arthur"></div><div class="field"><label>Nom</label><input id="last" placeholder="Dupont"></div></div><div class="grid g2"><div class="field"><label>Pays</label><select id="country"><option>🇫🇷 France</option><option>🇪🇸 Espagne</option><option>🇮🇹 Italie</option><option>🇺🇸 États-Unis</option><option>🇷🇸 Serbie</option><option>🇬🇧 Royaume-Uni</option></select></div><div class="field"><label>Style</label><select id="style"><option>Agressif fond de court</option><option>Gros serveur</option><option>Défenseur</option><option>Polyvalent</option><option>Contreur</option></select></div></div><p class="notice">Départ à 17 ans avec 25 points. Les qualifications et les petits tournois sont essentiels pour grimper progressivement.</p><button onclick="UT.start()">Commencer</button></div>')}
function make(f,l,c,s){let x=base();x.first=f;x.last=l;x.country=c;x.style=s;return x}function start(){P=make(document.getElementById('first').value||'Arthur',document.getElementById('last').value||'Dupont',document.getElementById('country').value,document.getElementById('style').value);save();view='dash';render()}function demo(){P=make('Arthur','Magic','🇫🇷 France','Agressif fond de court');save();view='dash';render()}
function dash(){let t=current();shell('<div class="card"><div class="top"><div><h2>'+esc(P.first)+' '+esc(P.last)+'</h2><span class="muted">'+P.country+' • '+P.age+' ans • '+P.style+'</span></div><span class="tag">ATP #'+rank()+' • OVR '+overall()+'</span></div></div><div class="grid g4"><div class="stat"><small>Classement</small><strong>#'+rank()+'</strong></div><div class="stat"><small>Points</small><strong>'+P.points+'</strong></div><div class="stat"><small>Bilan</small><strong>'+P.wins+'–'+P.losses+'</strong></div><div class="stat"><small>Titres</small><strong>'+P.titles+'</strong></div></div><div class="card"><h3>Prochain tournoi</h3><div class="row"><span>'+t[1]+' <b>'+t[0]+'</b><small>'+t[2]+' • '+t[4]+'</small></span><b>'+t[3]+' pts</b></div><div class="actions"><button onclick="UT.enter()">🎾 S’inscrire</button><button class="secondary" onclick="UT.recover()">Récupérer</button></div></div><div class="grid g3"><div class="stat"><small>Forme</small><strong>'+P.fitness+'%</strong><div class="bar"><i style="width:'+P.fitness+'%"></i></div></div><div class="stat"><small>Énergie</small><strong>'+P.energy+'%</strong><div class="bar"><i style="width:'+P.energy+'%"></i></div></div><div class="stat"><small>Moral</small><strong>'+P.morale+'%</strong><div class="bar"><i style="width:'+P.morale+'%"></i></div></div></div><div class="card"><h3>Actualités</h3><div class="feed">'+(P.history.length?P.history.slice(-7).reverse().map(x=>'<p>'+x+'</p>').join(''):'<p class="muted">Le circuit t’attend. Commence par les petits tournois et les qualifications.</p>')+'</div></div>')}
function tourneys(){shell('<div class="card"><h2>Tournois & niveaux</h2><p class="muted">ITF → Challenger → ATP 250 → ATP 500 → Masters 1000 → Grand Chelem.</p>'+tourneys.map((t,i)=>'<div class="row"><span><b>'+t[1]+' '+t[0]+'</b><small>'+t[2]+' • '+t[4]+' • semaine '+t[5]+'</small></span><span><b>'+t[3]+' pts</b><br><button onclick="UT.info('+i+')">Voir</button></span></div>').join('')+'</div>')}
function calendar(){shell('<div class="card"><h2>Calendrier '+P.year+'</h2>'+tourneys.map((t,i)=>'<div class="row"><span><b>S'+t[5]+' — '+t[1]+' '+t[0]+'</b><small>'+t[2]+' • '+t[4]+'</small></span><b>'+t[3]+' pts</b></div>').join('')+'</div>')}
function info(i){let t=tourneys[i];let q=qualificationNeeded(t);modal('<h2>'+t[1]+' '+t[0]+'</h2><p>'+t[2]+' • '+t[4]+' • '+t[3]+' points</p><p><b>Tableau :</b> '+t[6]+' joueurs. <b>Qualifs :</b> '+(q?'oui, 2 tours minimum':'non')+'</p><p>Les joueurs hors tableau principal doivent passer les qualifications. Les points et les gains dépendent du tour atteint.</p><button onclick="UT.close();UT.enterAt('+i+')">Préparer</button> <button class="secondary" onclick="UT.close()">Fermer</button>')}
function qualificationNeeded(t){if(t[2]==='ITF M25'||t[2].indexOf('Challenger')===0)return rank()>t[6]-8;if(t[2]==='ATP 250')return rank()>t[6]-4;if(t[2]==='ATP 500')return rank()>t[6]-2;return rank()>t[6]}
function enterAt(i){P.current=i;let t=tourneys[i];if(P.fitness<30){alert('Forme insuffisante.');return}if(qualificationNeeded(t)){startQual(i,1);return}startMain(i,1)}
function enter(){enterAt(P.week-1)}
function startQual(i,r){match={t:i,stage:'Q'+r,round:r,set:0,me:0,op:0,setsM:0,setsO:0,opp:opponent(ovr()-5),qual:true};view='match';render()}
function startMain(i,r){match={t:i,stage:'R'+r,round:r,set:0,me:0,op:0,setsM:0,setsO:0,opp:opponent(ovr()+Math.floor(Math.random()*9)-5),qual:false};view='match';render()}
function opponent(level){let n=firsts[Math.floor(Math.random()*firsts.length)]+' '+lasts[Math.floor(Math.random()*lasts.length)];return {name:n,level:Math.max(35,level+Math.floor(Math.random()*17)-8),style:['Serveur','Agressif','Défenseur','Polyvalent'][Math.floor(Math.random()*4)]}}
function matchPage(){let t=tourneys[match.t];shell('<div class="card"><div class="top"><div><span class="tag">'+match.stage+(match.qual?' • QUALIFICATIONS':' • TABLEAU PRINCIPAL')+'</span><h2>'+t[1]+' '+t[0]+'</h2><span class="muted">'+t[2]+' • '+t[4]+'</span></div><span class="tag">'+match.opp.style+' • OVR '+match.opp.level+'</span></div><div style="text-align:center;font-size:38px;font-weight:400;margin:12px">'+match.setsM+' — '+match.setsO+'</div><div style="text-align:center" class="muted">Jeu : '+match.me+' — '+match.op+'</div><div class="court"><div class="oppdot"></div><div class="playerdot"></div><div class="ball"></div></div><div class="shots"><button onclick="UT.point(\'safe\')">Sûr</button><button onclick="UT.point(\'attack\')">Attaque</button><button onclick="UT.point(\'power\')">Puissance</button><button onclick="UT.point(\'serve\')">Service</button></div><p class="notice">La surface, ton style, ta forme, ton énergie et le niveau adverse influencent chaque point.</p></div>')}
function point(type){let t=tourneys[match.t];let stat=type==='serve'?P.serve:type==='power'?P.forehand:type==='attack'?P.forehand+P.speed:P.return+P.backhand;let styleBonus=P.style==='Gros serveur'&&type==='serve'?5:P.style==='Défenseur'&&type==='safe'?4:0;let surface=t[4]==='Terre battue'?(P.stamina+P.speed)/20:t[4]==='Gazon'?P.serve/10:(P.forehand+P.return)/20;let chance=.45+(stat+styleBonus+surface-match.opp.level)/150+(P.energy-60)/300;chance=Math.max(.18,Math.min(.82,chance));let win=Math.random()<chance;if(win)match.me++;else match.op++;P.energy=Math.max(0,P.energy-(Math.random()<.15?2:1));if(match.me>=4&&match.me-match.op>=2){match.setsM++;match.me=0;match.op=0}else if(match.op>=4&&match.op-match.me>=2){match.setsO++;match.me=0;match.op=0}if(match.setsM>=2||match.setsO>=2){finishMatch();return}render()}
function finishMatch(){let t=tourneys[match.t];let win=match.setsM>match.setsO;if(win){P.wins++;P.morale=Math.min(100,P.morale+4)}else{P.losses++;P.morale=Math.max(0,P.morale-4)}P.fitness=Math.max(0,P.fitness-8);P.energy=Math.max(0,P.energy-12);let base=t[3];let roundFactor=match.qual?.08:Math.min(1,(1/(match.round+1))+.15);let pts=win?Math.max(1,Math.round(base*roundFactor)):0;let prize=win?Math.max(250,Math.round(base*7*roundFactor)):Math.round(base*.7);P.points+=pts;P.money+=prize;P.careerPrize+=prize;P.seasonPrize+=prize;P.history.push((win?'✅ Victoire ':'❌ Défaite ')+match.opp.name+' à '+t[0]+' ('+match.stage+')'+(pts?' • +'+pts+' pts':'')+' • +'+prize+' €');if(win&&match.qual){if(match.round<2){startQual(match.t,match.round+1);return}startMain(match.t,1);return}if(win&&!match.qual&&match.round<4){startMain(match.t,match.round+1);return}if(win&&!match.qual){P.titles++;if(t[2]==='Grand Chelem')P.slams++}advanceWeek();view='dash';save();render()}
function advanceWeek(){P.week++;if(P.week>tourneys.length){P.week=1;P.year++;P.age++;P.seasonPrize=0;P.history.push('📅 Nouvelle saison : '+P.year+'. Ton classement est recalculé selon tes points.')}save()}
function recover(){P.energy=Math.min(100,P.energy+22+P.fitnessCoach*3);P.fitness=Math.min(100,P.fitness+16+P.physio*2);P.morale=Math.min(100,P.morale+3);P.week++;if(P.week>tourneys.length){P.week=1;P.year++;P.age++}save();render()}
function training(){let a=[['serve','Service'],['return','Retour'],['forehand','Coup droit'],['backhand','Revers'],['speed','Vitesse'],['stamina','Endurance'],['mental','Mental']];shell('<div class="card"><h2>Entraînement</h2><p class="muted">Les gains diminuent quand tu approches ton plafond. Une séance coûte de l’énergie et de la forme.</p><div class="grid g3">'+a.map(x=>'<button onclick="UT.train(\''+x[0]+'\')">'+x[1]+' +1</button>').join('')+'</div><div class="grid g3"><div class="stat"><small>Forme</small><strong>'+P.fitness+'%</strong></div><div class="stat"><small>Énergie</small><strong>'+P.energy+'%</strong></div><div class="stat"><small>OVR</small><strong>'+overall()+'</strong></div></div></div>')}
function train(s){if(P.energy<15||P.fitness<15){alert('Tu es trop fatigué. Récupère.');return}let agePenalty=P.age>25?0.7:1;P[s]=Math.min(92,P[s]+Math.max(.2,.8*agePenalty));P.energy-=12;P.fitness-=5;P.morale=Math.min(100,P.morale+1);save();render()}
function player(){let a=[['serve','Service'],['return','Retour'],['forehand','Coup droit'],['backhand','Revers'],['speed','Vitesse'],['stamina','Endurance'],['mental','Mental']];shell('<div class="card"><h2>'+esc(P.first)+' '+esc(P.last)+'</h2><p class="muted">'+P.country+' • '+P.age+' ans • '+P.style+'</p><div class="grid g3">'+a.map(x=>'<div class="stat"><small>'+x[1]+'</small><strong>'+Math.round(P[x[0]])+'</strong><div class="bar"><i style="width:'+P[x[0]]+'%"></i></div></div>').join('')+'</div></div>')}
function staff(){let items=[['coach','Coach',1200],['physio','Kinésithérapeute',1500],['fitnessCoach','Préparateur physique',1400]];shell('<div class="card"><h2>Staff</h2>'+items.map(x=>'<div class="row"><span><b>'+x[0]+'</b><small>Niveau '+P[x[0]]+'</small></span><button onclick="UT.hire(\''+x[0]+'\','+x[2]+')">Engager '+x[2]+' €</button></div>').join('')+'</div>')}
function hire(k,c){if(P.money<c){alert('Budget insuffisant');return}P.money-=c;P[k]++;save();render()}
