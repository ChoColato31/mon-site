<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Ultimate Tennis — V3</title><style>
:root{--bg:#06101c;--panel:#0d1c2d;--panel2:#132940;--line:#23425f;--blue:#2b8cff;--cyan:#35c5ff;--green:#29d391;--gold:#ffd166;--red:#ff6171;--text:#f5f8fc;--muted:#91a9bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#164e77 0,transparent 32%),linear-gradient(160deg,#06101c,#091727);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;color:#fff;background:var(--blue);padding:11px 14px;border-radius:11px;font-weight:800;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}button.secondary{background:#183149}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:26px;font-weight:950;letter-spacing:-.8px}.brand span{color:var(--cyan)}.wallet{background:#10263b;border:1px solid var(--line);padding:9px 12px;border-radius:999px}.nav{display:flex;gap:7px;overflow:auto;padding:14px 0}.nav button{background:#10243a;white-space:nowrap}.nav button.on{background:var(--blue)}.card{background:linear-gradient(180deg,rgba(19,41,64,.96),rgba(11,28,45,.96));border:1px solid var(--line);border-radius:17px;padding:17px;margin:10px 0;box-shadow:0 12px 30px rgba(0,0,0,.15)}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#091a2b;border:1px solid #1c3852;border-radius:13px;padding:13px}.stat small,.muted{color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #1d3850}.row:last-child{border:0}.row small{display:block}.hero{text-align:center;padding:65px 10px}.hero h1{font-size:54px;letter-spacing:-2px;margin:0}.hero h1 span{color:var(--cyan)}.hero p{max-width:650px;margin:12px auto 25px;color:var(--muted);font-size:16px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%;padding:12px;border-radius:10px;background:#071524;color:#fff;border:1px solid var(--line)}.bar{height:8px;background:#1b344c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.tag{display:inline-block;padding:5px 8px;background:#17314a;border-radius:7px;color:#b9d6ed;font-size:12px}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}.actions{display:flex;flex-wrap:wrap;gap:8px}.notice{padding:10px 12px;background:#102941;border-left:3px solid var(--cyan);border-radius:8px}.matchhead{text-align:center}.score{font-size:42px;font-weight:950;text-align:center;letter-spacing:2px}.score small{font-size:14px;color:var(--muted);display:block;letter-spacing:0}.court{height:285px;max-width:760px;margin:15px auto;position:relative;overflow:hidden;background:#2479a9;border:5px solid #fff;box-shadow:inset 0 0 0 2px #d7eefb}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff}.net{position:absolute;left:50%;top:0;height:100%;width:7px;background:rgba(230,230,230,.7)}.court:after{content:"";position:absolute;left:9%;right:9%;top:50%;height:2px;background:#fff}.playerdot,.oppdot{position:absolute;width:34px;height:34px;border-radius:50%;z-index:3}.playerdot{bottom:22px;left:calc(50% - 17px);background:#ff4e5e}.oppdot{top:22px;left:calc(50% - 17px);background:#111827;border:2px solid #fff}.ball{position:absolute;width:15px;height:15px;border-radius:50%;background:#efff00;z-index:4;left:48%;top:48%;transition:.18s}.shotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shotgrid button{padding:14px 6px}.toast{position:fixed;right:14px;bottom:14px;max-width:340px;padding:13px 15px;border-radius:12px;background:#142e47;border:1px solid #315575;z-index:10}.hide{display:none!important}.table{overflow:auto}.rankrow{display:grid;grid-template-columns:45px 1fr 90px 90px;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #1b354c}.rounds{display:flex;gap:8px;overflow:auto}.round{min-width:170px;background:#091a2b;border:1px solid #203e59;padding:10px;border-radius:10px}.round strong{display:block;margin-bottom:6px}@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.shotgrid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:39px}.rankrow{grid-template-columns:35px 1fr 70px}.rankrow span:nth-child(4){display:none}}
</style></head><body><div id="root" class="app"></div><div id="toast" class="toast hide"></div><script>
const KEY='ultimateTennisV3';let P=JSON.parse(localStorage.getItem(KEY)||'null');let view='home',M=null;
const EVENTS=[
['ATP Challenger 125','🇫🇷','Challenger 125',125,'dur'],['Australian Open','🇦🇺','Grand Chelem',2000,'hard'],['Indian Wells','🇺🇸','Masters 1000',1000,'hard'],['Miami Open','🇺🇸','Masters 1000',1000,'hard'],['Monte-Carlo Masters','🇲🇨','Masters 1000',1000,'clay'],['Madrid Open','🇪🇸','Masters 1000',1000,'clay'],['Rome Masters','🇮🇹','Masters 1000',1000,'clay'],['Roland-Garros','🇫🇷','Grand Chelem',2000,'clay'],['Queen’s Club','🇬🇧','ATP 500',500,'grass'],['Wimbledon','🇬🇧','Grand Chelem',2000,'grass'],['Cincinnati Open','🇺🇸','Masters 1000',1000,'hard'],['US Open','🇺🇸','Grand Chelem',2000,'hard'],['Paris Masters','🇫🇷','Masters 1000',1000,'hard'],['ATP Finals','🇮🇹','Finals',1500,'hard']];
const PROS=[['Jannik Sinner',1,11800],['Carlos Alcaraz',2,10400],['Novak Djokovic',3,8200],['Alexander Zverev',4,7000],['Daniil Medvedev',5,6100],['Taylor Fritz',6,5200],['Holger Rune',7,4700],['Alex de Minaur',8,4300],['Lorenzo Musetti',9,3900],['Ben Shelton',10,3500],['Andrey Rublev',11,3300],['Jack Draper',12,3100]];
const OPP=['Matteo Rossi','Lucas Moretti','Noah Williams','Hugo Martin','Ethan Cole','Liam Parker','Leo Novak','Milan Kovac','Diego Alvarez','Tom Becker','Adam Wilson','Nico Romano','Jonas Berg','Felix Weber','Sacha Moreau'];
function save(){localStorage.setItem(KEY,JSON.stringify(P))}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hide');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hide'),2400)}
function overall(){return Math.round((P.serve+P.forehand+P.backhand+P.speed+P.stamina+P.mental)/6)}function ranking(){return Math.max(1,Math.min(999,Math.round(950-P.points/17)))}function surfaceBonus(){return {hard:P.hard||50,clay:P.clay||50,grass:P.grass||50}}function nav(){let a=[['dash','🏠 Carrière'],['tour','🏟️ Tournois'],['training','💪 Entraînement'],['ranking','🏆 Classement'],['player','👤 Profil'],['staff','👔 Staff'],['gear','🎒 Équipement']];return `<div class="nav">${a.map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function shell(body){document.getElementById('root').innerHTML=`<div class="top"><div class="brand">🎾 <span>ULTIMATE</span> TENNIS <small class="muted">V3</small></div>${P?`<div class="wallet">💰 ${P.money.toLocaleString('fr-FR')} €</div>`:''}</div>${P?nav():''}${body}`}
function go(v){view=v;render()}
function render(){if(!P){shell(`<div class="hero"><h1>ULTIMATE <span>TENNIS</span></h1><p>Une carrière de tennis progressive : entraînement, forme, calendrier, tournois, classement et matchs avec le vrai système de score.</p><button onclick="create()">Créer une carrière</button><button class="secondary" onclick="demo()">Démo</button></div>`);return}if(view==='dash')dash();else if(view==='tour')tour();else if(view==='training')training();else if(view==='ranking')rankPage();else if(view==='player')playerPage();else if(view==='staff')staff();else if(view==='gear')gear();else if(view==='match')matchPage()}
function create(){shell(`<div class="card"><h2>Nouvelle carrière</h2><div class="grid g2"><div class="field"><label>Prénom</label><input id="fn" placeholder="Arthur"></div><div class="field"><label>Nom</label><input id="ln" placeholder="Dupont"></div></div><div class="grid g2"><div class="field"><label>Pays</label><select id="ct"><option>🇫🇷 France</option><option>🇪🇸 Espagne</option><option>🇮🇹 Italie</option><option>🇺🇸 États-Unis</option><option>🇷🇸 Serbie</option><option>🇬🇧 Royaume-Uni</option></select></div><div class="field"><label>Profil</label><select id="style"><option>Offensif</option><option>Défenseur</option><option>Polyvalent</option><option>Serveur-volleyeur</option></select></div></div><div class="notice">Tu démarres à 17 ans avec un niveau de jeune professionnel. Le développement demande du temps : la forme, le moral et la charge d'entraînement comptent.</div><button onclick="start()">Commencer</button></div>`)}
function base(first,last,country,style){return{first,last,country,style,age:17,season:2026,week:1,money:5000,points:25,serve:60,forehand:62,backhand:58,speed:65,stamina:70,mental:55,fitness:92,morale:78,wins:0,losses:0,titles:0,slams:0,seasonWins:0,seasonLosses:0,seasonMoney:0,hard:50,clay:48,grass:42,coach:0,physio:0,fitnessCoach:0,equipment:0,history:[],currentTournament:0}}
function start(){P=base(document.getElementById('fn').value.trim()||'Arthur',document.getElementById('ln').value.trim()||'Dupont',document.getElementById('ct').value,document.getElementById('style').value);save();view='dash';render();toast('Carrière créée')}
function demo(){P=base('Arthur','Magic','🇫🇷 France','Offensif');save();view='dash';render()}
function dash(){let t=EVENTS[P.currentTournament];shell(`<div class="card"><div class="top"><div><h2>${esc(P.first)} ${esc(P.last)}</h2><span class="muted">${P.country} • ${P.age} ans • ${P.style}</span></div><div><span class="tag">#${ranking()}</span> <span class="tag">OVR ${overall()}</span></div></div></div><div class="grid g4"><div class="stat"><small>Classement</small><b>#${ranking()}</b></div><div class="stat"><small>Points ATP</small><b>${P.points}</b></div><div class="stat"><small>Bilan</small><b>${P.wins}-${P.losses}</b></div><div class="stat"><small>Titres</small><b>${P.titles}</b></div></div><div class="card"><h3>📌 Prochain tournoi</h3><div class="row"><div><b>${t[1]} ${t[0]}</b><small>${t[2]} • ${t[4]==='clay'?'Terre battue':t[4]==='grass'?'Gazon':'Dur'}</small></div><strong>${t[3]} pts</strong></div><div class="actions"><button onclick="enterTournament()">🎾 Entrer dans le tournoi</button><button class="secondary" onclick="rest()">😴 Récupérer</button></div></div><div class="grid g3"><div class="card"><small class="muted">Forme</small><h2>${P.fitness}%</h2><div class="bar"><i style="width:${P.fitness}%"></i></div></div><div class="card"><small class="muted">Moral</small><h2>${P.morale}%</h2><div class="bar"><i style="width:${P.morale}%"></i></div></div><div class="card"><small class="muted">Gains saison</small><h2>${P.seasonMoney.toLocaleString('fr-FR')} €</h2></div></div><div class="card"><h3>📰 Dernières nouvelles</h3>${P.history.slice(-3).reverse().map(x=>`<div class="row"><span>${esc(x.text)}</span><small class="muted">${x.week}</small></div>`).join('')||'<p class="muted">Ta carrière commence ici.</p>'}</div>`)}
function tour(){shell(`<div class="card"><h2>🏟️ Calendrier de la saison</h2>${EVENTS.map((t,i)=>`<div class="row"><div><b>${i+1}. ${t[1]} ${t[0]}</b><small>${t[2]} • ${t[4]==='clay'?'Terre battue':t[4]==='grass'?'Gazon':'Dur'}</small></div><div><strong>${t[3]} pts</strong> ${i===P.currentTournament?'<span class="tag">À venir</span>':''}</div></div>`).join('')}</div>`)}
function training(){let arr=[['serve','Service'],['forehand','Coup droit'],['backhand','Revers'],['speed','Vitesse'],['stamina','Endurance'],['mental','Mental']];shell(`<div class="card"><h2>💪 Entraînement</h2><p class="muted">Une séance améliore légèrement une compétence mais réduit la forme. Les progrès sont volontairement lents pour éviter une progression irréaliste.</p><div class="grid g3">${arr.map(a=>`<button onclick="train('${a[0]}')">${a[1]} <small>+1</small></button>`).join('')}</div><div class="card"><b>Forme ${P.fitness}%</b><div class="bar"><i style="width:${P.fitness}%"></i></div><p>Coach : niveau ${P.coach} • Préparateur : niveau ${P.fitnessCoach}</p></div></div>`)}
function train(s){if(P.fitness<12)return toast('Forme trop basse : récupère avant de t’entraîner.');P[s]=Math.min(92,P[s]+1);P.fitness=Math.max(0,P.fitness-10);P.morale=Math.min(100,P.morale+1);save();toast(`${s} +1`);render()}
function rest(){P.fitness=Math.min(100,P.fitness+25+P.fitnessCoach*2);P.morale=Math.min(100,P.morale+5);P.week++;advance();save();toast('Semaine de récupération terminée');render()}
function advance(){if(P.week>14){P.season++;P.age++;P.week=1;P.seasonWins=P.seasonLosses=P.seasonMoney=0;P.currentTournament=0;P.history.push({text:`Début de la saison ${P.season}`,week:'Nouvelle saison'})}}
function rankPage(){let arr=PROS.map(x=>({name:x[0],pts:x[2]}));arr.push({name:`${P.first} ${P.last}`,pts:P.points,me:true});arr.sort((a,b)=>b.pts-a.pts);shell(`<div class="card"><h2>🏆 Classement mondial</h2><p class="muted">Classement simulé du jeu. Les points de ton joueur proviennent de ses résultats dans cette carrière.</p><div class="table">${arr.map((x,i)=>`<div class="rankrow"><span><b>#${i+1}</b></span><span>${esc(x.name)} ${x.me?'<span class="tag">TOI</span>':''}</span><span>${x.pts}</span><span class="muted">${x.me?'Carrière': 'Tour ATP'}</span></div>`).join('')}</div></div>`)}
function playerPage(){let ss=[['serve','Service'],['forehand','Coup droit'],['backhand','Revers'],['speed','Vitesse'],['stamina','Endurance'],['mental','Mental']];shell(`<div class="card"><div class="top"><div><h2>👤 ${esc(P.first)} ${esc(P.last)}</h2><p class="muted">${P.country} • ${P.age} ans • ${P.style}</p></div><span class="tag">OVR ${overall()}</span></div><div class="grid g3">${ss.map(s=>`<div class="stat"><small>${s[1]}</small><b>${P[s[0]]}</b><div class="bar"><i style="width:${P[s[0]]}%"></i></div></div>`).join('')}</div></div><div class="card"><h3>🎾 Surfaces</h3><div class="grid g3">${[['hard','Dur'],['clay','Terre battue'],['grass','Gazon']].map(s=>`<div class="stat"><small>${s[1]}</small><b>${P[s[0]]}</b></div>`).join('')}</div></div><div class="card"><h3>Carrière</h3><div class="grid g4"><div class="stat"><small>Victoires</small><b>${P.wins}</b></div><div class="stat"><small>Défaites</small><b>${P.losses}</b></div><div class="stat"><small>Titres</small><b>${P.titles}</b></div><div class="stat"><small>Grand Chelem</small><b>${P.slams}</b></div></div></div>`)}
function staff(){shell(`<div class="card"><h2>👔 Staff</h2>${[['coach','Coach','Améliore l'entraînement',700],['physio','Kinésithérapeute','Réduit légèrement l'usure après les matchs',900],['fitnessCoach','Préparateur physique','Récupération plus efficace',850]].map(x=>`<div class="row"><div><b>${x[1]}</b><small>${x[2]} • Niveau ${P[x[0]]}</small></div><button onclick="hire('${x[0]}',${x[3]})">${x[3]} €</button></div>`).join('')}</div>`)}
function hire(k,c){if(P.money<c)return toast('Budget insuffisant');P.money-=c;P[k]++;save();toast('Staff recruté');render()}
function gear(){shell(`<div class="card"><h2>🎒 Équipement</h2>${[['Raquette contrôle','forehand',500],['Raquette puissance','serve',650],['Chaussures rapides','speed',450],['Cordage endurance','stamina',450]].map(x=>`<div class="row"><div><b>${x[0]}</b><small>+2 ${x[1]}</small></div><button onclick="buy('${x[1]}',${x[2]})">${x[2]} €</button></div>`).join('')}</div>`)}
function buy(s,c){if(P.money<c)return toast('Budget insuffisant');P.money-=c;P[s]=Math.min(92,P[s]+2);P.equipment++;save();toast('Équipement installé');render()}
function enterTournament(){if(P.fitness<35)return toast('Forme insuffisante pour disputer un tournoi.');let t=EVENTS[P.currentTournament];let rounds=t[2]==='Grand Chelem'?7:t[2]==='Masters 1000'?6:t[2]==='ATP 500'?5:t[2]==='Finals'?3:6;let baseRating=Math.max(55,overall()-Math.floor(Math.random()*7));let opp=55+Math.min(35,P.currentTournament*2)+Math.floor(Math.random()*14);M={t,round:1,totalRounds:rounds,oppRating:opp,pg:0,eg:0,ps:0,es:0,tb:false,serveSide:Math.random()<.5?'Toi':'Adversaire',points:0,sets:[]};view='match';render()}
function matchPage(){let t=M.t;let surf=t[4];let surfRating=P[surf];shell(`<div class="card matchhead"><span class="tag">${t[2]}</span><h2>${t[1]} ${t[0]}</h2><p class="muted">Tour ${M.round}/${M.totalRounds} • ${surf==='clay'?'Terre battue':surf==='grass'?'Gazon':'Dur'} • ${M.serveSide} au service</p><div class="score"><small>${esc(P.first)} ${P.ps||''} &nbsp;—&nbsp; ${M.oppRating} OVR</small>${M.ps} — ${M.es}<small>Set en cours : ${M.pg} — ${M.eg}${M.tb?' • TIE-BREAK':''}</small></div></div><div class="court"><div class="oppdot"></div><div class="net"></div><div id="ball" class="ball"></div><div class="playerdot"></div></div><div class="shotgrid"><button onclick="point('safe')">🎾 Coup sûr</button><button onclick="point('attack')">🔥 Attaque</button><button onclick="point('power')">💥 Puissance</button><button onclick="point('serve')">🚀 Service</button></div><div class="card"><div class="row"><span>Forme</span><b>${P.fitness}%</b></div><div class="row"><span>Surface</span><b>${surfRating}</b></div><p id="msg" class="notice">Choisis ton coup. Le résultat dépend du profil, de la forme, de la surface et du niveau adverse.</p></div>`)}
function point(type){let s=M.t[4],surface=(P[s]-50)/170;let atk={safe:P.backhand*.11+P.mental*.06,attack:P.forehand*.15+P.speed*.05,power:P.forehand*.08+P.serve*.13,serve:P.serve*.19+P.mental*.04}[type];let form=(P.fitness-50)/170;let rating=(overall()-M.oppRating)/180;let serveBonus=(M.serveSide==='Toi'&&type==='serve')?.10:0;let chance=.5+surface+form+rating+atk/100+serveBonus;chance=Math.max(.22,Math.min(.78,chance));let win=Math.random()<chance;let b=document.getElementById('ball');if(b){b.style.left=(10+Math.random()*78)+'%';b.style.top=(10+Math.random()*78)+'%'}if(win){M.pg++;document.getElementById('msg').textContent='Point gagné — bonne construction.'}else{M.eg++;document.getElementById('msg').textContent='Point perdu — l’adversaire répond.'}P.fitness=Math.max(0,P.fitness-(type==='power'?2:1));if(M.pg>=6&&M.pg-M.eg>=2){endSet(true)}else if(M.eg>=6&&M.eg-M.pg>=2){endSet(false)}else if(M.pg===6&&M.eg===6){M.tb=true;M.pg=0;M.eg=0;toast('6-6 : tie-break !')}else if(M.tb&&((M.pg>=7||M.eg>=7)&&Math.abs(M.pg-M.eg)>=2)){endSet(M.pg>M.eg)}else{M.serveSide=M.serveSide==='Toi'?'Adversaire':'Toi';render()}}
function endSet(win){if(M.tb){M.tb=false}M.sets.push(`${M.pg}-${M.eg}`);if(win)M.ps++;else M.es++;M.pg=M.eg=0;M.serveSide=Math.random()<.5?'Toi':'Adversaire';if(M.ps>=2||M.es>=2){finishMatch(M.ps>M.es);return}M.round;save();render()}
function finishMatch(win){let t=M.t;let prize=win?Math.round(t[3]*.08*(M.round===M.totalRounds?20:1)):Math.round(t[3]*.005);let pts=win?Math.round(t[3]/M.totalRounds):Math.round(t[3]/(M.totalRounds*8));P.money+=prize;P.seasonMoney+=prize;P.points+=pts;P.fitness=Math.max(0,P.fitness-(win?8:5));if(win){P.wins++;P.seasonWins++;if(M.round===M.totalRounds){P.titles++;if(t[2]==='Grand Chelem')P.slams++;toast('🏆 CHAMPION DU TOURNOI !')}}else{P.losses++;P.seasonLosses++}P.history.push({text:`${win?'Victoire':'Défaite'} à ${t[0]} • ${win?'+':''}${pts} pts • ${prize} €`,week:`S${P.season} • T${P.currentTournament+1}`});if(win&&M.round<M.totalRounds){/* tournoi suivant : le joueur doit gagner chaque tour */}P.currentTournament++;P.week++;if(P.currentTournament>=EVENTS.length){P.currentTournament=0;P.season++;P.age++;P.seasonWins=P.seasonLosses=P.seasonMoney=0;P.week=1;P.history.push({text:`Nouvelle saison : ${P.season}`,week:'Inter-saison'})}save();view='dash';render();toast(win?`Victoire ! +${pts} pts`:`Défaite • +${pts} pts`)}
render();
</script></body></html>
