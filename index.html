<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0a08"><title>Ultimate Tennis</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;touch-action:manipulation;overscroll-behavior:none}body{background:radial-gradient(circle at 50% -10%,#463813 0,#12110e 35%,#080807 80%);color:#f5f0e4;font:350 14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;touch-action:manipulation}button{border:1px solid #745b20;border-radius:10px;padding:12px 15px;background:linear-gradient(135deg,#e4c45f,#a97919);color:#171209;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}button:active{transform:scale(.98)}button.secondary{background:#171512;color:#e5d7ad;border-color:#44391f}.app{max-width:1150px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:25px;font-weight:450;letter-spacing:.6px}.brand b{color:#e5c15b;font-weight:600}.wallet{padding:8px 12px;border:1px solid #4a3b1c;border-radius:999px;color:#e7d6a4;background:#15130f}.nav{display:flex;gap:6px;overflow-x:auto;padding:13px 0}.nav button{white-space:nowrap;background:#12110f;color:#c9c0ac;border-color:#30291b;font-weight:450}.nav .on{background:#b58a2c;color:white;border-color:#d7b54e}.card{background:linear-gradient(180deg,#181613,#11100e);border:1px solid #352b1a;border-radius:16px;padding:17px;margin:11px 0;box-shadow:0 12px 30px #0006}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.stat{background:#0e0d0b;border:1px solid #2b251a;border-radius:12px;padding:13px}.stat strong{display:block;font-size:22px;font-weight:450;color:#f0dfad;margin-top:3px}.muted{color:#9c957f}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #292318}.row:last-child{border:0}.hero{text-align:center;padding:80px 10px}.hero h1{font-size:54px;font-weight:350;letter-spacing:-2px;margin:0}.hero h1 span{color:#e4c15b;font-weight:450}.hero p{max-width:700px;margin:14px auto 25px;color:#a49c86;font-size:16px}.field{display:grid;gap:6px;margin:11px 0}.field input,.field select{width:100%;padding:12px;border-radius:9px;border:1px solid #3c321f;background:#0c0b09;color:#eee5d1}.bar{height:7px;background:#292318;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9a711d,#efd06a)}.actions{display:flex;flex-wrap:wrap;gap:8px}.tag{display:inline-block;padding:5px 8px;border-radius:7px;background:#19150e;color:#d5c28e;border:1px solid #3b301c;font-size:12px}.notice{padding:12px;background:#19150d;border-left:3px solid #d2a83f;border-radius:7px;color:#c9ba91}.bracket{display:flex;gap:10px;overflow:auto}.round{min-width:190px;background:#0d0c0a;border:1px solid #2d2618;border-radius:11px;padding:10px}.round h4{color:#d9bc69;margin:0 0 8px;font-weight:500}.match{padding:9px;border:1px solid #292216;border-radius:8px;margin:6px 0}.good{color:#70c997}.danger{color:#e77b7b}.gold{color:#e5c25b}.court{height:280px;max-width:720px;margin:15px auto;position:relative;background:#277a6d;border:4px solid #eee7d5}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#eee}.court:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:#eee}.p1,.p2{position:absolute;width:30px;height:30px;border-radius:50%}.p1{bottom:20px;left:calc(50% - 15px);background:#e7c553}.p2{top:20px;left:calc(50% - 15px);background:#181818;border:2px solid white}.ball{position:absolute;width:13px;height:13px;border-radius:50%;background:#efff2b;left:48%;top:48%}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}@media(max-width:700px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.shots{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:39px}.app{padding:11px}.brand{font-size:21px}}
</style></head>
<body><main id="app" class="app"></main>
<script>
'use strict';
var KEY='ultimateTennisStable';
var tournaments=[
['Australian Open','🇦🇺','Grand Chelem',2000,'Dur',128],['Adelaide','🇦🇺','ATP 250',250,'Dur',32],['Canberra','🇦🇺','Challenger 125',125,'Dur',32],['Melbourne M25','🇦🇺','ITF M25',25,'Dur',32],['Cherbourg','🇫🇷','Challenger 75',75,'Dur',32],['Marseille','🇫🇷','ATP 250',250,'Dur',32],['Rotterdam','🇳🇱','ATP 500',500,'Dur',32],['Lille','🇫🇷','Challenger 100',100,'Dur',48],['Saint-Brieuc','🇫🇷','ITF M25',25,'Dur',32],['Indian Wells','🇺🇸','Masters 1000',1000,'Dur',96],['Miami','🇺🇸','Masters 1000',1000,'Dur',96],['Monte-Carlo','🇲🇨','Masters 1000',1000,'Terre battue',96],['Barcelona','🇪🇸','ATP 500',500,'Terre battue',32],['Madrid','🇪🇸','Masters 1000',1000,'Terre battue',96],['Rome','🇮🇹','Masters 1000',1000,'Terre battue',96],['Bordeaux','🇫🇷','Challenger 125',125,'Terre battue',32],['Roland-Garros','🇫🇷','Grand Chelem',2000,'Terre battue',128],['Nottingham','🇬🇧','Challenger 125',125,'Gazon',32],['Stuttgart','🇩🇪','ATP 250',250,'Gazon',32],['Queen’s','🇬🇧','ATP 500',500,'Gazon',32],['Wimbledon','🇬🇧','Grand Chelem',2000,'Gazon',128],['Umag','🇭🇷','ATP 250',250,'Terre battue',32],['Cincinnati','🇺🇸','Masters 1000',1000,'Dur',96],['Winston-Salem','🇺🇸','ATP 250',250,'Dur',48],['US Open','🇺🇸','Grand Chelem',2000,'Dur',128],['Cary','🇺🇸','Challenger 100',100,'Dur',48],['Tokyo','🇯🇵','ATP 500',500,'Dur',32],['Shanghai','🇨🇳','Masters 1000',1000,'Dur',96],['Orléans','🇫🇷','Challenger 125',125,'Dur',32],['Antalya','🇹🇷','ITF M25',25,'Terre battue',32],['Paris','🇫🇷','Masters 1000',1000,'Dur',96],['ATP Finals','🇮🇹','Finals',1500,'Dur',8]
];
var pros=['Jannik Sinner','Carlos Alcaraz','Novak Djokovic','Alexander Zverev','Daniil Medvedev','Taylor Fritz','Alex de Minaur','Lorenzo Musetti','Ben Shelton','Holger Rune','Casper Ruud','Andrey Rublev','Stefanos Tsitsipas','Arthur Fils','Jack Draper','Tommy Paul','Ugo Humbert','Matteo Berrettini'];
var styles=['Agressif fond de court','Gros serveur','Défenseur','Polyvalent'];
var P=null,view='home',match=null;
function base(){return {first:'Arthur',last:'Dupont',country:'🇫🇷 France',style:'Agressif fond de court',age:17,year:2026,week:1,money:5000,points:25,fitness:92,energy:90,morale:78,serve:58,retour:54,forehand:62,backhand:58,speed:65,stamina:68,mental:55,wins:0,losses:0,titles:0,slams:0,careerPrize:0,seasonPrize:0,history:[],injury:0,staff:{coach:0,physio:0,fitness:0}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function load(){try{P=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){P=null}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function rank(){return Math.max(1,Math.round(1080-P.points/14))}
function current(){return tournaments[(P.week-1)%tournaments.length]}
function shell(body){document.getElementById('app').innerHTML='<div class="top"><div class="brand">🎾 <b>ULTIMATE</b> TENNIS</div>'+(P?'<div class="wallet">💰 '+P.money.toLocaleString('fr-FR')+' €</div>':'')+'</div>'+(P?nav():'')+body}
function nav(){var a=[['dash','Accueil'],['tourneys','Tournois'],['calendar','Calendrier'],['ranking','Classement'],['training','Entraînement'],['player','Joueur'],['staff','Staff'],['finance','Finances'],['history','Carrière']];return '<div class="nav">'+a.map(function(x){return '<button class="'+(view===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function go(v){view=v;render()}
function render(){if(!P)return home();if(view==='dash')dash();else if(view==='tourneys')tourneys();else if(view==='calendar')calendar();else if(view==='ranking')ranking();else if(view==='training')training();else if(view==='player')player();else if(view==='staff')staff();else if(view==='finance')finance();else if(view==='history')history();else if(view==='match')matchPage();else dash()}
function home(){shell('<section class="hero"><h1>ULTIMATE <span>TENNIS</span></h1><p>Construis une carrière professionnelle du circuit ITF aux Grand Chelems.</p><button onclick="create()">Créer ma carrière</button> <button class="secondary" onclick="demo()">Démo</button></section>')}
function create(){shell('<div class="card"><h2>Créer ton joueur</h2><div class="grid g2"><div class="field"><label>Prénom</label><input id="first" placeholder="Arthur"></div><div class="field"><label>Nom</label><input id="last" placeholder="Dupont"></div></div><div class="grid g2"><div class="field"><label>Pays</label><select id="country"><option>🇫🇷 France</option><option>🇪🇸 Espagne</option><option>🇮🇹 Italie</option><option>🇺🇸 États-Unis</option><option>🇷🇸 Serbie</option></select></div><div class="field"><label>Style</label><select id="style">'+styles.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div></div><div class="notice">Tu démarres à 17 ans avec un classement hors Top 100. Les qualifications et les petits tournois sont la voie normale vers le circuit principal.</div><br><button onclick="start()">Lancer la carrière</button></div>')}
function start(){var x=base();x.first=document.getElementById('first').value||'Arthur';x.last=document.getElementById('last').value||'Dupont';x.country=document.getElementById('country').value;x.style=document.getElementById('style').value;P=x;save();view='dash';render()}
function demo(){P=base();save();view='dash';render()}
function dash(){var t=current();shell('<div class="card"><div class="row"><div><h2>'+esc(P.first)+' '+esc(P.last)+'</h2><span class="muted">'+P.country+' · '+P.age+' ans · '+P.style+'</span></div><strong class="gold">ATP #'+rank()+'</strong></div></div><div class="grid g4"><div class="stat">Classement<strong>#'+rank()+'</strong></div><div class="stat">Points<strong>'+P.points+'</strong></div><div class="stat">Bilan<strong>'+P.wins+' - '+P.losses+'</strong></div><div class="stat">Titres<strong>'+P.titles+'</strong></div></div><div class="card"><h3>Prochain tournoi</h3><div class="row"><span>'+t[1]+' '+t[0]+'<small>'+t[2]+' · '+t[4]+'</small></span><b>'+t[3]+' pts</b></div><div class="actions"><button onclick="enterTournament()">🎾 Entrer dans le tournoi</button><button class="secondary" onclick="rest()">Récupérer</button></div></div><div class="card"><h3>État</h3><p>Forme '+P.fitness+'%</p><div class="bar"><i style="width:'+P.fitness+'%"></i></div><p>Énergie '+P.energy+'%</p><div class="bar"><i style="width:'+P.energy+'%"></i></div><p>Moral '+P.morale+'%</p><div class="bar"><i style="width:'+P.morale+'%"></i></div></div>')}
function tourneys(){shell('<div class="card"><h2>🏆 Tournois</h2><p class="muted">Les petits tournois permettent de gagner des points et d’atteindre progressivement les qualifications du niveau supérieur.</p>'+tournaments.map(function(t,i){var accessible=P.rank<=120||t[2].indexOf('ITF')>=0||t[2].indexOf('Challenger')>=0||Math.random()<.25;return '<div class="row"><span>'+t[1]+' '+t[0]+'<small>'+t[2]+' · '+t[4]+' · '+t[5]+' joueurs</small></span><button '+(accessible?'':'disabled')+' onclick="chooseTournament('+i+')">'+(accessible?'Voir':'Trop haut')+'</button></div>'}).join('')+'</div>')}
function chooseTournament(i){P.week=(i+1);save();enterTournament()}
function enterTournament(){var t=current();var needsQual=(P.points<1200&&t[2]!=='ITF M25'&&t[2].indexOf('Challenger')<0);match={t:t,qual:needsQual,round:needsQual?'Qualifications - R1':'Tableau principal - R1',setP:0,setO:0,gameP:0,gameO:0,setsP:0,setsO:0,wonQual:0};view='match';render()}
function matchPage(){shell('<div class="card"><div class="row"><span><h2>'+match.t[1]+' '+match.t[0]+'</h2><small>'+match.t[2]+' · '+match.t[4]+'</small></span><b>'+match.round+'</b></div><div class="grid g3"><div class="stat">Sets<strong>'+match.setsP+' - '+match.setsO+'</strong></div><div class="stat">Jeu<strong>'+match.gameP+' - '+match.gameO+'</strong></div><div class="stat">Forme<strong>'+P.fitness+'%</strong></div></div><div class="court"><div class="p2"></div><div class="p1"></div><div class="ball"></div></div><div class="shots"><button onclick="point(\'safe\')">Coup sûr</button><button onclick="point(\'attack\')">Attaque</button><button onclick="point(\'serve\')">Service</button><button onclick="point(\'risk\')">Prise de risque</button></div><p class="notice">Un set se gagne à 6 jeux avec deux jeux d’écart. À 6-6, tie-break simplifié.</p></div>')}
function point(type){var stat=type==='serve'?P.serve:type==='attack'?P.forehand:type==='risk'?Math.round((P.forehand+P.serve)/2):Math.round((P.retour+P.backhand)/2);var opp=55+Math.random()*28;var chance=.42+(stat-opp)/160+(P.energy-50)/500+(P.morale-50)/900;if(Math.random()<Math.max(.15,Math.min(.85,chance))){match.gameP++}else{match.gameO++;P.energy=Math.max(0,P.energy-1)}if(match.gameP>=6&&match.gameP-match.gameO>=2){match.setsP++;match.gameP=0;match.gameO=0}else if(match.gameO>=6&&match.gameO-match.gameP>=2){match.setsO++;match.gameP=0;match.gameO=0}if(match.setsP>=2||match.setsO>=2)finishMatch();else render()}
function finishMatch(){var win=match.setsP>match.setsO;if(match.qual&&!match.wonQual&&win){match.wonQual=1;match.round='Qualifications - R2';match.setsP=match.setsO=match.gameP=match.gameO=0;render();return}var pts=win?Math.round(match.t[3]/8):Math.round(match.t[3]/40);var prize=win?Math.round(match.t[3]*2.2):Math.round(match.t[3]*.2);P.points+=pts;P.money+=prize;P.careerPrize+=prize;P.seasonPrize+=prize;if(win){P.wins++;if(!match.qual&&Math.random()<.06){P.titles++;if(match.t[2]==='Grand Chelem')P.slams++}}else P.losses++;P.fitness=Math.max(0,P.fitness-10);P.energy=Math.max(0,P.energy-15);P.history.unshift({event:match.t[0],result:win?'Victoire':'Défaite',points:pts,prize:prize});P.history=P.history.slice(0,40);P.week++;if(P.week>tournaments.length){P.week=1;P.year++;P.age++;P.seasonPrize=0}save();view='dash';render()}
function rest(){P.energy=Math.min(100,P.energy+30);P.fitness=Math.min(100,P.fitness+20);P.morale=Math.min(100,P.morale+3);P.week++;save();render()}
function calendar(){shell('<div class="card"><h2>📅 Calendrier</h2>'+tournaments.map(function(t,i){return '<div class="row"><span>S'+(i+1)+' · '+t[1]+' '+t[0]+'<small>'+t[2]+' · '+t[4]+'</small></span><b>'+t[3]+' pts</b></div>'}).join('')+'</div>')}
function ranking(){var list=pros.map(function(n,i){return {n:n,p:12000-i*430}});list.push({n:P.first+' '+P.last,p:P.points});list.sort(function(a,b){return b.p-a.p});shell('<div class="card"><h2>🌍 Classement mondial</h2>'+list.slice(0,30).map(function(x,i){return '<div class="row"><span>#'+(i+1)+' · '+esc(x.n)+'</span><b>'+x.p+' pts</b></div>'}).join('')+'</div>')}
function training(){shell('<div class="card"><h2>💪 Entraînement</h2><p class="muted">Une séance coûte de l’énergie mais améliore progressivement une qualité.</p><div class="grid g2"><button onclick="train(\'serve\')">Service +1</button><button onclick="train(\'forehand\')">Coup droit +1</button><button onclick="train(\'backhand\')">Revers +1</button><button onclick="train(\'speed\')">Vitesse +1</button><button onclick="train(\'stamina\')">Endurance +1</button><button onclick="train(\'mental\')">Mental +1</button></div></div>')}
function train(s){if(P.energy<8)return alert('Pas assez d’énergie.');P[s]=Math.min(99,P[s]+1);P.energy=Math.max(0,P.energy-8);P.fitness=Math.max(0,P.fitness-3);save();render()}
function player(){var a=['serve','retour','forehand','backhand','speed','stamina','mental'];shell('<div class="card"><h2>👤 '+esc(P.first)+' '+esc(P.last)+'</h2><p>'+P.country+' · '+P.age+' ans · '+P.style+'</p><div class="grid g3">'+a.map(function(s){return '<div class="stat">'+s+'<strong>'+P[s]+'</strong><div class="bar"><i style="width:'+P[s]+'%"></i></div></div>'}).join('')+'</div></div>')}
function staff(){shell('<div class="card"><h2>👔 Staff</h2><div class="row"><span>Coach</span><button onclick="hire(\'coach\',2500)">Engager · 2 500 €</button></div><div class="row"><span>Kinésithérapeute</span><button onclick="hire(\'physio\',1800)">Engager · 1 800 €</button></div><div class="row"><span>Préparateur physique</span><button onclick="hire(\'fitness\',2200)">Engager · 2 200 €</button></div></div>')}
function hire(s,c){if(P.money<c)return alert('Pas assez d’argent.');if(P.staff[s])return alert('Déjà engagé.');P.money-=c;P.staff[s]=1;save();render()}
function finance(){shell('<div class="card"><h2>💰 Finances</h2><div class="grid g3"><div class="stat">Solde<strong>'+P.money.toLocaleString('fr-FR')+' €</strong></div><div class="stat">Gains carrière<strong>'+P.careerPrize.toLocaleString('fr-FR')+' €</strong></div><div class="stat">Gains saison<strong>'+P.seasonPrize.toLocaleString('fr-FR')+' €</strong></div></div><div class="notice">Les petits tournois paient peu, mais permettent d’accumuler des points et d’ouvrir l’accès aux niveaux supérieurs.</div></div>')}
function history(){shell('<div class="card"><h2>📚 Historique</h2>'+(P.history.length?P.history.map(function(h){return '<div class="row"><span>'+esc(h.event)+'<small class="'+(h.result==='Victoire'?'good':'danger')+'">'+h.result+'</small></span><span>+'+h.points+' pts · +'+h.prize+' €</span></div>'}).join(''):'<p class="muted">Aucun résultat.</p>')+'</div>')}
load();render();
</script></body></html>
