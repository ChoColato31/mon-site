<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Tennis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:#168cff;color:#fff;font-weight:800}button.secondary{background:#19314a}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:27px;font-weight:900}.logo b{color:#39c7ff}.wallet,.tag{background:#132a42;border:1px solid #294764;border-radius:999px;padding:8px 12px}.nav{display:flex;gap:7px;overflow:auto;margin:15px 0}.nav button{white-space:nowrap;background:#112840}.nav .active{background:#168cff}.card{background:#102238;border:1px solid #25445f;border-radius:17px;padding:17px;margin:12px 0}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.stat{background:#0b1b2d;border:1px solid #203b54;border-radius:13px;padding:14px}.stat small,.muted{color:#8da7bd}.stat strong{display:block;font-size:25px;margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #203b54}.row:last-child{border:0}.hero{text-align:center;padding:70px 10px}.hero h1{font-size:52px;margin:0}.hero h1 span{color:#39c7ff}.hero p{color:#8da7bd;max-width:650px;margin:12px auto 25px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{padding:12px;background:#081625;color:#fff;border:1px solid #294764;border-radius:10px;width:100%}.bar{height:8px;background:#1d374f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2bbcff}.actions{display:flex;gap:8px;flex-wrap:wrap}.court{height:260px;background:#287cab;border:5px solid white;position:relative;max-width:720px;margin:15px auto}.court .net{position:absolute;left:50%;top:0;height:100%;width:5px;background:#ddd}.court .me,.court .op{position:absolute;width:30px;height:30px;border-radius:50%}.court .me{left:calc(50% - 15px);bottom:20px;background:#ff5162}.court .op{left:calc(50% - 15px);top:20px;background:#111;border:2px solid white}.ball{position:absolute;width:14px;height:14px;border-radius:50%;background:#efff00;left:48%;top:48%}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.notice{padding:12px;background:#132d46;border-left:3px solid #39c7ff;border-radius:8px}.hide{display:none}@media(max-width:700px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.shots{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:38px}}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
(function(){
'use strict';
var KEY='ultimateTennisSafeV3';
var tournaments=[
 ['ATP Challenger 125','🇫🇷','Challenger',125,'Dur'],['Australian Open','🇦🇺','Grand Chelem',2000,'Dur'],['Indian Wells','🇺🇸','Masters 1000',1000,'Dur'],['Miami Open','🇺🇸','Masters 1000',1000,'Dur'],['Monte-Carlo','🇲🇨','Masters 1000',1000,'Terre'],['Madrid','🇪🇸','Masters 1000',1000,'Terre'],['Rome','🇮🇹','Masters 1000',1000,'Terre'],['Roland-Garros','🇫🇷','Grand Chelem',2000,'Terre'],['Queen’s Club','🇬🇧','ATP 500',500,'Gazon'],['Wimbledon','🇬🇧','Grand Chelem',2000,'Gazon'],['Cincinnati','🇺🇸','Masters 1000',1000,'Dur'],['US Open','🇺🇸','Grand Chelem',2000,'Dur'],['Paris','🇫🇷','Masters 1000',1000,'Dur'],['ATP Finals','🇮🇹','Finals',1500,'Dur']
];
var opponents=['Matteo Rossi','Lucas Moretti','Noah Williams','Hugo Martin','Ethan Cole','Liam Parker','Leo Novak','Milan Kovac','Diego Alvarez','Tom Becker'];
var P=null,view='home',M=null;
function load(){try{var x=localStorage.getItem(KEY);P=x?JSON.parse(x):null}catch(e){P=null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function esc(x){return String(x).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function overall(){return Math.round((P.serve+P.forehand+P.backhand+P.speed+P.stamina+P.mental)/6)}
function rank(){return Math.max(1,Math.round(950-P.points/18))}
function nav(){var a=[['dash','🏠 Carrière'],['calendar','📅 Calendrier'],['training','💪 Entraînement'],['ranking','🏆 Classement'],['player','👤 Joueur'],['staff','👔 Staff']];return '<div class="nav">'+a.map(function(x){return '<button class="'+(view===x[0]?'active':'')+'" onclick="UT.go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function shell(body){document.getElementById('app').innerHTML='<div class="top"><div class="logo">🎾 <b>ULTIMATE</b> TENNIS</div>'+(P?'<div class="wallet">💰 '+P.money.toLocaleString('fr-FR')+' €</div>':'')+'</div>'+(P?nav():'')+body}
function home(){shell('<section class="hero"><h1>ULTIMATE <span>TENNIS</span></h1><p>Construis ta carrière professionnelle, entraîne ton joueur, dispute les grands tournois et grimpe au classement mondial.</p><button onclick="UT.create()">Créer ma carrière</button> <button class="secondary" onclick="UT.demo()">Démo</button></section>')}
function create(){shell('<div class="card"><h2>Créer ton joueur</h2><div class="grid g2"><div class="field"><label>Prénom</label><input id="first" placeholder="Arthur"></div><div class="field"><label>Nom</label><input id="last" placeholder="Dupont"></div></div><div class="grid g2"><div class="field"><label>Pays</label><select id="country"><option>🇫🇷 France</option><option>🇪🇸 Espagne</option><option>🇮🇹 Italie</option><option>🇺🇸 États-Unis</option><option>🇬🇧 Royaume-Uni</option><option>🇷🇸 Serbie</option></select></div><div class="field"><label>Style</label><select id="style"><option>Offensif</option><option>Polyvalent</option><option>Défenseur</option><option>Serveur-volleyeur</option></select></div></div><p class="notice">Départ réaliste : 17 ans, niveau jeune professionnel, progression lente et dépendante de l’entraînement et de la forme.</p><button onclick="UT.start()">Commencer</button></div>')}
function make(first,last,country,style){return {first:first,last:last,country:country,style:style,age:17,season:2026,week:1,money:5000,points:25,serve:60,forehand:62,backhand:58,speed:65,stamina:70,mental:55,fitness:92,morale:78,wins:0,losses:0,titles:0,slams:0,hard:50,clay:48,grass:42,coach:0,physio:0,fitnessCoach:0,tournament:0,history:[]}}
function start(){P=make(document.getElementById('first').value||'Arthur',document.getElementById('last').value||'Dupont',document.getElementById('country').value,document.getElementById('style').value);save();view='dash';render()}
function demo(){P=make('Arthur','Magic','🇫🇷 France','Offensif');save();view='dash';render()}
function dash(){var t=tournaments[P.tournament];shell('<div class="card"><div class="top"><div><h2>'+esc(P.first)+' '+esc(P.last)+'</h2><span class="muted">'+P.country+' • '+P.age+' ans • '+P.style+'</span></div><span class="tag">OVR '+overall()+' • #'+rank()+'</span></div></div><div class="grid g4"><div class="stat"><small>Classement</small><strong>#'+rank()+'</strong></div><div class="stat"><small>Points ATP</small><strong>'+P.points+'</strong></div><div class="stat"><small>Bilan</small><strong>'+P.wins+'-'+P.losses+'</strong></div><div class="stat"><small>Titres</small><strong>'+P.titles+'</strong></div></div><div class="card"><h3>Prochain tournoi</h3><div class="row"><span>'+t[1]+' <b>'+t[0]+'</b><small class="muted">'+t[2]+' • '+t[4]+'</small></span><b>'+t[3]+' pts</b></div><div class="actions"><button onclick="UT.play()">🎾 Jouer</button><button class="secondary" onclick="UT.rest()">😴 Récupérer</button></div></div><div class="grid g3"><div class="stat"><small>Forme</small><strong>'+P.fitness+'%</strong><div class="bar"><i style="width:'+P.fitness+'%"></i></div></div><div class="stat"><small>Moral</small><strong>'+P.morale+'%</strong><div class="bar"><i style="width:'+P.morale+'%"></i></div></div><div class="stat"><small>Gains saison</small><strong>'+P.money.toLocaleString('fr-FR')+' €</strong></div></div></div>')}
function calendar(){shell('<div class="card"><h2>📅 Calendrier</h2>'+tournaments.map(function(t,i){return '<div class="row"><span><b>'+i+'. '+t[1]+' '+t[0]+'</b><small class="muted">'+t[2]+' • '+t[4]+'</small></span><b>'+t[3]+' pts</b></div>'}).join('')+'</div>')}
function training(){var a=[['serve','Service'],['forehand','Coup droit'],['backhand','Revers'],['speed','Vitesse'],['stamina','Endurance'],['mental','Mental']];shell('<div class="card"><h2>💪 Entraînement</h2><p class="muted">Chaque séance coûte de la forme et améliore seulement légèrement une compétence.</p><div class="grid g3">'+a.map(function(x){return '<button onclick="UT.train(\''+x[0]+'\')">'+x[1]+' +1</button>'}).join('')+'</div><p>Forme : '+P.fitness+'%</p><div class="bar"><i style="width:'+P.fitness+'%"></i></div></div>')}
function train(s){if(P.fitness<12)return alert('Forme trop basse. Récupère.');P[s]=Math.min(92,P[s]+1);P.fitness=Math.max(0,P.fitness-10);save();render()}
function rest(){P.fitness=Math.min(100,P.fitness+25+P.fitnessCoach*2);P.morale=Math.min(100,P.morale+4);P.week++;if(P.week>14){P.week=1;P.season++;P.age++;P.tournament=0}save();render()}
function ranking(){var a=[['Jannik Sinner',11800],['Carlos Alcaraz',10400],['Novak Djokovic',8200],['Alexander Zverev',7000],['Daniil Medvedev',6100],['Taylor Fritz',5200],['Holger Rune',4700],['Alex de Minaur',4300],['Lorenzo Musetti',3900],['Ben Shelton',3500], [P.first+' '+P.last,P.points]];a.sort(function(x,y){return y[1]-x[1]});shell('<div class="card"><h2>🏆 Classement mondial</h2>'+a.map(function(x,i){return '<div class="row"><span>#'+(i+1)+' '+esc(x[0])+'</span><b>'+x[1]+' pts</b></div>'}).join('')+'</div>')}
function player(){shell('<div class="card"><h2>👤 '+esc(P.first)+' '+esc(P.last)+'</h2><p class="muted">'+P.country+' • '+P.age+' ans • '+P.style+'</p><div class="grid g3">'+[['serve','Service'],['forehand','Coup droit'],['backhand','Revers'],['speed','Vitesse'],['stamina','Endurance'],['mental','Mental']].map(function(x){return '<div class="stat"><small>'+x[1]+'</small><strong>'+P[x[0]]+'</strong><div class="bar"><i style="width:'+P[x[0]]+'%"></i></div></div>'}).join('')+'</div></div>')}
function staff(){shell('<div class="card"><h2>👔 Staff</h2>'+[['coach','Coach',700],['physio','Kinésithérapeute',900],['fitnessCoach','Préparateur physique',850]].map(function(x){return '<div class="row"><span><b>'+x[0]+'</b><small class="muted">Niveau '+P[x[0]]+'</small></span><button onclick="UT.hire(\''+x[0]+'\','+x[2]+')">'+x[2]+' €</button></div>'}).join('')+'</div>')}
function hire(k,c){if(P.money<c)return alert('Budget insuffisant');P.money-=c;P[k]++;save();render()}
function play(){if(P.fitness<35)return alert('Forme insuffisante.');var t=tournaments[P.tournament];M={t:t,round:1,setsWon:0,setsLost:0,g1:0,g2:0,op:Math.max(55,overall()-3+Math.floor(Math.random()*9)),serve:true};view='match';render()}
function match(){shell('<div class="card"><div style="text-align:center"><span class="tag">'+M.t[2]+' • '+M.t[4]+'</span><h2>'+M.t[1]+' '+M.t[0]+'</h2><p class="muted">Tour '+M.round+'</p><div style="font-size:42px;font-weight:900">'+M.setsWon+' — '+M.setsLost+'</div><div class="muted">Set : '+M.g1+' — '+M.g2+'</div></div><div class="court"><div class="op"></div><div class="net"></div><div class="ball"></div><div class="me"></div></div><div class="shots"><button onclick="UT.point(\'safe\')">🎾 Sûr</button><button onclick="UT.point(\'attack\')">🔥 Attaque</button><button onclick="UT.point(\'power\')">💥 Puissance</button><button onclick="UT.point(\'serve\')">🚀 Service</button></div><p class="notice">Choisis ton coup. Le résultat dépend de tes statistiques, de la surface, de la forme et du niveau adverse.</p></div>')}
function point(type){var surface=M.t[4]=='Terre'?P.clay:M.t[4]=='Gazon'?P.grass:P.hard;var skill=type=='serve'?P.serve:type=='power'?P.forehand:type=='attack'?P.forehand:P.backhand;var chance=.5+(skill-M.op)/170+(surface-50)/220+(P.fitness-50)/300+(P.morale-50)/500;if(type=='serve'&&M.serve)chance+=.08;chance=Math.max(.25,Math.min(.75,chance));if(Math.random()<chance)M.g1++;else M.g2++;P.fitness=Math.max(0,P.fitness-(type=='power'?2:1));M.serve=!M.serve;if((M.g1>=4||M.g2>=4)&&Math.abs(M.g1-M.g2)>=2){var win=M.g1>M.g2;if(win)M.setsWon++;else M.setsLost++;M.g1=0;M.g2=0;if(M.setsWon>=2||M.setsLost>=2){finish(M.setsWon>M.setsLost);return}}save();render()}
function finish(win){var t=M.t;var pts=win?Math.max(10,Math.round(t[3]/8)):Math.max(2,Math.round(t[3]/40));var cash=win?Math.round(t[3]*.12):Math.round(t[3]*.01);P.points+=pts;P.money+=cash;if(win)P.wins++;else P.losses++;if(win&&M.round>=5){P.titles++;if(t[2]=='Grand Chelem')P.slams++}P.fitness=Math.max(0,P.fitness-8);P.tournament++;P.week++;if(P.tournament>=tournaments.length){P.tournament=0;P.season++;P.age++;P.week=1}save();view='dash';render();alert((win?'Victoire ! ':'Défaite. ')+'+'+pts+' points ATP')}
function render(){if(!P){home();return}if(view=='dash')dash();else if(view=='calendar')calendar();else if(view=='training')training();else if(view=='ranking')ranking();else if(view=='player')player();else if(view=='staff')staff();else if(view=='match')match();else dash()}
window.UT={go:function(v){view=v;render()},create:create,start:start,demo:demo,play:play,point:point,train:train,rest:rest,hire:hire};
load();render();
})();
</script></body></html>
